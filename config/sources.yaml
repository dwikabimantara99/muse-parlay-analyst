# sources.yaml — daftar sumber data berjenjang (DECISIONS.md B).
# MENGGANTIKAN Blueprint §4. Semua sumber GRATIS. API key disimpan di .env,
# JANGAN PERNAH di file ini.
#
# Jenjang: 1 = RESMI (penyelenggara kompetisi), 2 = agregator besar terpercaya,
# 3 = sumber valid lain (hanya kalau jenjang 1-2 tidak punya).
# Selalu pakai jenjang tertinggi yang tersedia; catat jenjang + sumber + jam.
# Urutan kandidat dalam tiap daftar = urutan prioritas (pertama = utama).

meta:
  version: 3
  project: muse-parlay-analyst
  source: "DECISIONS.md B (2026-11-20) + koreksi pasca probe 2a (2026-11-20)"

tiers:
  1:
    name: "RESMI"
    description: "Penyelenggara kompetisinya langsung."
  2:
    name: "Agregator besar terpercaya"
    description: "ESPN, Understat (xG), Basketball-Reference, Rotowire; Kalshi & Polymarket untuk pembanding."
  3:
    name: "Sumber valid lain"
    description: "Hanya kalau jenjang 1-2 tidak punya data yang dibutuhkan."

# Format tiap jenis data: candidates (daftar sumber berjenjang) + env_key
# (nama variabel di .env, atau null bila tidak butuh key).
sources:
  jup_prices:
    label: "Harga ¢ jup.ag"
    candidates:
      - name: "Jupiter Prediction API"
        tier: 1
        url: "https://developers.jup.ag/docs/guides/how-to-build-a-prediction-market-app-on-solana"
        notes: "API key gratis dari Portal. HANYA BACA — DILARANG memanggil endpoint order, execute, atau apa pun yang memindahkan dana (DECISIONS.md C3). API masih beta, bisa berubah."
      - name: "Screenshot yang dikirim user"
        tier: 3
        notes: "Cadangan bila API gagal."
    env_key: "JUPITER_API_KEY"

  comparison_prices:
    label: "Harga pasar pembanding"
    # Urutan pembanding p_market (keputusan user 2026-11-20, pasca probe 2a):
    # sportsbook (Odds API, devig) -> ESPN odds (devig) -> Kalshi.
    # Polymarket TIDAK dipakai untuk pasar jup.ag asal Polymarket (P2).
    candidates:
      - name: "The Odds API"
        tier: 2
        notes: "UTAMA untuk p_market: devig sportsbook (region eu, Pinnacle). Paket gratis, batas D3."
      - name: "ESPN odds"
        tier: 2
        notes: "Pembanding gratis kedua (devig) — HANYA BOLA: scoreboard EPL terverifikasi 7/7 (DraftKings ML+spread+total; summary tambah Bet 365 ML desimal). NBA TIDAK ADA odds di ESPN — untuk NBA, setelah Odds API langsung ke Kalshi."
      - name: "Kalshi API"
        tier: 2
        notes: "Publik. Pembanding independen sah untuk pasar jup.ag asal Polymarket (P2/P3)."
      - name: "Polymarket API"
        tier: 2
        notes: "Publik. HANYA untuk pasar jup.ag yang BUKAN asal Polymarket (P2) — untuk pasar asal Polymarket ini harga yang sama, bukan pembanding."
    env_key: "ODDS_API_KEY"
    # D3: batas operasional The Odds API (bukan ambang strategi — dicatat di
    # sini, lihat DECISIONS.md D-T2).
    odds_api_limits:
      monthly_credit_limit: 500
      warn_at_pct: 80
      cache_minutes: 30
      max_calls_per_analysis: 2
      region: "eu"
      bookmaker: "Pinnacle"

  nba_schedule_stats:
    label: "Jadwal, skor, statistik tim NBA"
    candidates:
      - name: "stats.nba.com"
        tier: 1
        notes: "UTAMA untuk statistik NBA (probe 2a: bekerja dari VM; CDN scoreboard 403, jangan dipakai)."
      - name: "ESPN"
        tier: 2
        notes: "JSON publik. Cadangan bila stats.nba.com gagal."
      - name: "Basketball-Reference"
        tier: 2
    env_key: null

  nba_injuries:
    label: "Cedera NBA"
    candidates:
      - name: "Official NBA Injury Report"
        tier: 1
        notes: "PDF resmi, terverifikasi probe 2a (D4 TERJAWAB): halaman official.nba.com/nba-injury-report-2026-27-season/, PDF per 15 menit di ak-static.cms.nba.com/referee/injury/. Tim wajib lapor hari pertandingan 11 am-1 pm waktu lokal. Wajib dicek ulang dekat tip-off."
      - name: "ESPN injuries"
        tier: 2
      - name: "Rotowire"
        tier: 2
    env_key: null

  nba_player_impact:
    label: "Dampak pemain NBA"
    candidates:
      - name: "stats.nba.com"
        tier: 1
        notes: "UTAMA untuk statistik pemain resmi (probe 2a: bekerja dari VM)."
      - name: "Basketball-Reference"
        tier: 2
        notes: "BPM, menit, on/off. Untuk skenario absen 1/2/4 pemain."
      - name: "ESPN player stats"
        tier: 2
    env_key: null

  football_stats_xg:
    label: "Statistik & xG sepak bola"
    candidates:
      - name: "Situs/data resmi liga"
        tier: 1
        notes: "Premier League: endpoint JSON publik terverifikasi (probe 2a) — UTAMA untuk EPL. UEFA, LaLiga, Serie A, Bundesliga, Ligue 1: hanya HTML, bukan JSON langsung. FIFA untuk laga timnas. xG resmi kalau ada."
      - name: "Understat"
        tier: 2
        notes: "xG, 5 liga top Eropa. Maintenance saat probe 2a (2026-11-20); dicek ulang harian otomatis — aktif lagi bila kembali. Sampai ada xG, berlaku B4 (TANPA_XG)."
      - name: "ESPN soccer"
        tier: 2
        notes: "FBref kehilangan data xG sejak Januari 2026, jangan dipakai untuk xG."
    env_key: null

  football_lineup_injuries:
    label: "Lineup & cedera bola"
    candidates:
      - name: "Situs/data resmi liga"
        tier: 1
        notes: "Premier League JSON UTAMA untuk EPL (jadwal, lineup, cedera kalau tersedia). Liga lain: hanya HTML."
      - name: "ESPN soccer"
        tier: 2
        notes: "Lineup resmi biasanya keluar sekitar 60 menit sebelum kick-off."
    env_key: null

# Sumber yang DITOLAK — jangan dipakai fetcher mana pun. Dicatat di sini agar
# keputusan tidak hilang dan sumber tidak diuji ulang tanpa alasan.
rejected:
  - name: "FotMob"
    tier: 2
    rejected_on: "2026-11-20"
    reason: "Keputusan user: ketentuan layanan FotMob melarang pengambilan otomatis tanpa izin. Probe 2a membuktikan API-nya bekerja (2/2 HTTP 200), tapi pemakaian melanggar ToS."
  - name: "Sofascore"
    tier: 2
    rejected_on: "2026-11-20"
    reason: "Probe 2a (diterima user): 3/3 HTTP 403, tantangan bot aktif dari VM; tidak ada cara akses sah. Ditolak sampai ada cara akses sah."

rules:
  # B1: selalu pakai jenjang tertinggi yang tersedia.
  use_highest_tier_available: true
  # B1: setiap data disimpan dengan jenjang + sumber + jam pengambilan.
  record_tier_source_time: true
  # B2: cedera & lineup dicek silang minimal 2 sumber.
  cross_check_min_sources_injury_lineup: 2
  # Kalau dua sumber berbeda, laporan wajib menampilkan keduanya.
  show_conflicting_sources: true
  # B3: scraping boleh dengan etika berikut.
  scraping:
    allowed: true
    # Jeda antar request per situs — belum ada angkanya, tentukan di Tahap 2
    # dari batas tiap situs. null = belum ditentukan, jangan ditebak.
    request_delay_seconds: null  # TBD Tahap 2
    cache: true
    # String User-Agent yang jelas — ditentukan di Tahap 2.
    user_agent: null  # TBD Tahap 2
    respect_site_limits: true
  # B3: semua sumber mati -> DATA_INCOMPLETE.
  all_sources_dead: "DATA_INCOMPLETE"
  # B4: rantai xG bola: resmi -> Understat. FotMob DITOLAK (ToS, keputusan
  # user 2026-11-20), Sofascore DITOLAK (probe 2a: 403). Tidak ada xG ->
  # Dixon-Coles berbasis gol, label TANPA_XG (lihat playstyle.yaml no_xg).
  xg_chain: ["resmi", "Understat"]
  # Scraper wajib punya tes kecil yang memberi tahu kalau format sumber
  # berubah / scraper rusak.
  scrapers_require_health_test: true
