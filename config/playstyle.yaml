# playstyle.yaml — SATU-SATUNYA sumber ambang & default strategi.
# Blueprint: muse-parlay-analyst §6, §7 (plus angka terkait §3, §4, §5, §9).
# Pelengkap: DECISIONS.md (keputusan user 2026-11-20 & 2026-11-21; kalau
# berbeda dengan blueprint, DECISIONS.md yang berlaku).
# Aturan: angka strategi TIDAK BOLEH ditulis di tempat lain (kode, SOP, laporan).
# Kalau tidak ada angka yang diputuskan, nilainya null + komentar TBD — JANGAN ditebak.
# Semua peluang dalam desimal 0–1, kecuali disebut "poin" (1 poin = 1% = 0,01).
# Mata uang: USD (USDC dicatat 1:1, DECISIONS.md D14).
# Pengali: desimal (2,35x berarti modal kembali x2,35 kalau menang).

meta:
  version: 18.1
  project: muse-parlay-analyst
  source: "Blueprint Mesin Analis Parlay (Muse), Nov 20 2026 + DECISIONS.md 2026-11-20 & 2026-11-21 + fit NBA Tahap 3 (2026-11-22) + integrasi Langkah 1 (market_line_check, polymarket_ladder, jup markup) + patch langkah 1b perbaikan 2 (bpm_replacement) + perbaikan 3-4 (bantalan Asuransi target peluang, ESPN cedera), 2026-11-22 + Langkah 2 (recheck pra-submit) + adopsi nilai rolling (addendum Langkah 2), 2026-11-22 + Langkah 2 (shrinkage menit+BPM ke musim lalu), 2026-11-22 + Langkah 3 (peracik tiket: Utama maks 5,0x profil user 2026-11-22), 2026-11-22 + Langkah 4 (pantauan live: ambang status + risiko OT + anomali live), 2026-11-22 + Langkah 5 (otak bola: wiring soccer_brain/soccer_analysis, TANPA_XG), 2026-11-22 + Langkah 6 (kalibrasi w + usulan belajar: min_legs_w, section learning), 2026-11-22 + perbaikan racik analis adaptif (bantalan adaptif, nilai wajar, Asuransi >2,5x, section analis), 2026-11-23 + fondasi harga & pengali (Asuransi x2+, Utama x3+, tanpa price cap) + gate edge Asuransi, 2026-11-23 + skenario setan (deviasi maksimal 3PM, deteksi kerapuhan — BUKAN gate), 2026-11-23 + penyempurnaan mesin (equilibrium, skip dari awal, news, ekor 3P, OT di seleksi), 2026-11-23 + vonis per laga + veto rim protector + tanpa kaki kembar + equilibrium Asuransi safety-first + setan per pemain + koreksi banjir ke data bersih, 2026-11-23 + audit Gemini v17 / proposal v18 (vonis baru + veto AND + OT empiris + timing gate + EV ganti edge datar + gate eksekusi), 2026-11-23 + patch v18.1 (skip_awal EV + pagar anti-redundansi + komposer valid_lines + fallback (b) + peta rim protector 30/30 + filter kesegaran cedera + garis referensi tail_fragility + simetri D7), 2026-11-23"
  last_reviewed: "2026-11-23"

# ── §6a. Dua tiket ──────────────────────────────────────────────────────────
tickets:
  insurance:
    name: "Asuransi"
    # Fondasi harga & pengali (keputusan user 2026-11-23 08:19 WIB,
    # DECISIONS.md — MENGGANTIKAN filosofi lama yang menuntut Asuransi
    # di atas x2,5): target Asuransi x2 atau lebih dikit; x4–x5 adalah
    # KEBERUNTUNGAN bila analisis menunjukkan bisa tembus, bukan
    # target. Prioritas utama: SEMUA tiket lolos; pengali nomor dua.
    # Harga mahal BOLEH (kaki 89¢, Asuransi 94¢) asal statistik
    # bilang bisa diterima — TIDAK ADA price cap untuk ladder
    # climbing (pertanyaan terbuka perbaikan racik TERJAWAB: tanpa
    # cap). Rentang 2,0–2,5: batas bawah 2,0 tetap menutup total
    # modal dengan split 50/50 (2,0 x $10 = $20 dari modal $20).
    multiplier_min: 2.0         # dulu 2,5 (filosofi lama) — turun per fondasi baru
    multiplier_max: 2.5         # dulu 3,0 (filosofi lama) — turun per fondasi baru
    # TARGET ASURANSI TETAP x2 (keputusan user 2026-11-23 13:57 WIB,
    # DECISIONS.md "Jawaban user atas 4 keputusan v18" #1): usulan
    # Gemini 1,80x DITOLAK — x2 satu-satunya jalan menyelamatkan
    # modal; must_cover_total_stake TETAP true di bawah.
    # ── Gate kaki Asuransi v18 (audit Gemini §3 + keputusan user
    # #2/#3, 2026-11-23 13:57 WIB — MENGGANTIKAN gate edge datar
    # v17): min_edge_pct (3,5%) DIHAPUS — di ekor 85¢+ edge absolut
    # menyusut secara aljabar (keunggulan 3 poin hanya +1,3% di 82¢,
    # +0,3% di 90¢) sehingga gate itu + banjir 74% + lean-to-market
    # mengunci Equilibrium Asuransi 0/10 (deadlock §1.1 referensi).
    # Penggantinya: EV tidak boleh MAHAL + peluang tinggi + banjir
    # dilonggarkan ke 70%/65% (dipasangkan dengan min_leg_prob 0,82
    # yang LEBIH tinggi dari 0,74).
    min_leg_prob: 0.82          # v18: naik dari 0,74 (§6a idealnya ≥74% diganti)
    # p_market minimum kaki Asuransi: jangan bertaruh ekstrem melawan
    # pasar (proposal Gemini §3; keputusan user #2).
    min_p_market: 0.80
    # EV terburuk yang masih boleh (persen; -1,0 = EV >= -1%):
    # kaki Asuransi tidak boleh MAHAL (DISKON/WAJAR boleh masuk).
    # MENGGANTIKAN min_edge_pct. Utama punya ambang sendiri (-2,0).
    max_negative_ev_pct: -1.0
    # Gate skenario banjir v18 (pisah per skenario — MENGGANTIKAN
    # gate tunggal P banjir terburuk >= min_leg_prob 0,74):
    # P(Under) di banjir 3P >= 0,70 DAN di banjir FT >= 0,65.
    # Geser banjir dari section stress (data bersih 8,50/12,52).
    flood_3p_min: 0.70
    flood_ft_min: 0.65
    # Pita harga yang diutamakan equilibrium Asuransi (sen): 80–89¢.
    # BUKAN gate keras (garis di luar pita tetap boleh bila lolos
    # semua gate) — arahan pemilihan di dalam band (worker B).
    preferred_price_band: [80, 89]
    # ── v18: kunci lama stress_gate_scenario (gate banjir tunggal
    # v17, "banjir_terburuk") DIHAPUS — digantikan dua ambang
    # flood_3p_min / flood_ft_min di atas (keputusan integrasi
    # koordinator; tidak ada lagi pembaca di engine/ — komposer v18
    # memakai gate banjir CDF-langsung; tes
    # test_config_stress_gate_scenario_tidak_dibaca membuktikannya).
    # ── v18.1 Patch #2 "Perangkap Plafon 88,5¢" (REFERENSI-PATCH-
    # V18-1-GEMINI.md §1): safety-first dalam band 80–89¢ selalu
    # memetik plafon (P_final monoton naik terhadap harga) — di T2
    # v18 ketiga kaki Asuransi terkunci di 88,5¢ (pengali maks
    # x1,36). Perbaikannya TANPA pelonggaran gate: equilibrium
    # mengembalikan SEMUA garis valid (valid_lines) dan komposer
    # memilih kombinasi yang memaksimalkan peluang cair gabungan
    # (max Π P_final) dalam jendela target [2,00x, 2,50x].
    expose_all_valid_lines_to_composer: true
    # Satu-satunya tujuan komposer Asuransi yang didukung v18.1.
    # Nilai lain -> ConfigError (fail-closed).
    composer_objective: "max_joint_p_final_within_target_multiplier"
    # ── Fallback (b), KEPUTUSAN USER 2026-11-23 15:52 WIB
    # (DECISIONS.md "Pilihan fallback Asuransi (b) + filosofi
    # pasti menang"): bila tidak ada kombinasi >= 2,00x tanpa
    # melanggar gate, mesin MELAPORKAN opsi terbaik di
    # [1,80x, 1,99x] sebagai opsi berlabel (BUKAN tiket) —
    # lengkap dengan pengali, peluang cair gabungan, detail per
    # kaki, dan alasan. 1,80x BUKAN target (penolakan user
    # 13:57 WIB terhadap 1,80x sebagai TARGET tetap berlaku);
    # fallback hanya opsi terlaporkan, keputusan pasang di
    # tangan user. Batas atas 1,99x = target_min - 0,01 (di
    # bawah band target pada presisi sen).
    target_multiplier_fallback_min: 1.80
    # Syarat wajib §6a: pengali x modal Asuransi >= total modal kedua tiket.
    must_cover_total_stake: true
  main:
    name: "Utama"
    # Profil user 2026-11-22 (Tahap 3 Langkah 3): Utama x3–x4.
    # Menggantikan default blueprint 3,5x (batas bawah).
    multiplier_min: 3.0
    # Profil user 2026-11-22 (Tahap 3 Langkah 3): Utama x3–x4, MAKS x5
    # bila data sangat optimis; x3,5 saja sudah berkah; x9–x10 hanya
    # hiburan. Menggantikan default blueprint 6,0x.
    multiplier_max: 5.0
    # Target lunak peracik (fondasi harga & pengali, keputusan user
    # 2026-11-23 08:19 WIB — MENGGANTIKAN target lunak 4,0 profil
    # 2026-11-22): racikan Utama diusahakan ≤ 3,5x; di atas itu HANYA
    # bila mesin "yakin" (semua kaki p_final ≥ yakin_min_leg_prob +
    # semua TETAP_OK + tanpa anomali — kriteria USULAN Tahap 4,
    # menunggu keberatan user/reviewer); subset yakin di atas lunak
    # DIUTAMAKAN atas subset lunak (keputusan koordinator integrasi
    # Tahap 4). x4–x5 adalah keberuntungan, bukan target.
    target_multiplier_max: 3.5
    # Ambang p_final per kaki untuk kriteria "yakin" Utama di atas
    # target lunak (USULAN Tahap 4 — menunggu keberatan).
    yakin_min_leg_prob: 0.75
    # v18 (keputusan user #3, 2026-11-23 13:57 WIB): Utama boleh
    # ketat — min p_final naik dari 0,65 ke 0,74; yang penting
    # minimal x3 s.d. x5. BUKAN uji ketat-ketatan, tapi mencari kaki
    # paling masuk akal di dalam tiket.
    min_leg_prob: 0.74
    # EV terburuk yang masih boleh (persen; -2,0 = EV >= -2%):
    # kaki Utama ditolak bila sangat MAHAL (proposal Gemini §3).
    max_negative_ev_pct: -2.0
    # Pita harga yang diutamakan equilibrium Utama (sen): 76–84¢.
    # BUKAN gate keras — arahan pemilihan max-ER di dalam band.
    preferred_price_band: [76, 84]
    # Tie-break max-ER Utama: bila selisih ER dua garis < nilai ini,
    # pilih garis yang lebih aman (harga lebih tinggi).
    tiebreak_er_tolerance: 0.015
  # Mode default. "aggressive" hanya atas perintah user per malam ("malam ini
  # mode agresif"). Di mode agresif: multiplier_max Utama bebas + moneyline
  # di bawah 65% boleh dengan label wajib (lihat filters.moneyline).
  mode: standard                # standard | aggressive
  # D13: pembagian modal default 50/50, bisa diubah lewat chat.
  stake_split_default: {insurance: 0.5, main: 0.5}

# ── Gate eksekusi & likuiditas (v18 — audit Gemini §3 + keputusan user) ──
execution:
  # Volume PINDAH dari vonis laga ke gate eksekusi (v18): volume
  # adalah sifat orderbook garis jauh di Polymarket/jup.ag, BUKAN
  # cacat pertandingan — vonis tidak lagi memakai volume (kunci
  # min_volume di vonis DIHAPUS). Gate eksekusi berbasis stake user:
  # garis boleh dibeli bila likuiditasnya >= min_liquidity_multiplier
  # x stake kaki itu (mis. $30 untuk stake $15) DAN >=
  # liquidity_hard_min_usd (batas bawah absolut agar orderbook tidak
  # kosong total). MENGGANTIKAN ambang $100 kaku
  # (polymarket_ladder.min_volume_usd — kunci itu TETAP ADA untuk
  # flag "thin" di tangga/laporan; gate beli memakai kunci di sini).
  # ── REVISI KOORDINATOR v18 (integrasi): "likuiditas" di sini
  # adalah field `liquidity` Gamma (likuiditas pasar saat ini),
  # BUKAN `volume_usd` (volume kumulatif yang sudah diperdagangkan
  # — ukuran sejarah, bukan kemampuan beli sekarang). Bukti dari
  # artefak 22 Nov: garis Under dengan kuotasi hidup spread 2¢
  # (mis. DET U239,5 bid 79/ask 82, likuiditas $36.580) gagal gate
  # volume karena volume kumulatifnya cuma $5 — padahal order $15
  # di ask pasti terisi melawan kuotasi market maker. Gate volume
  # memblokir hampir semua garis alternatif (14/14 kombinasi
  # gagal di slate uji) dan membuat Tiket Asuransi tidak bisa
  # terbentuk. Karena itu gate eksekusi v18 = likuiditas Gamma
  # >= lantai DI BAWAH + spread bid/ask <= max_spread_cents +
  # ask nyata (< 99¢). Data hilang -> gagal (fail-closed).
  # Volume kumulatif TETAP dilaporkan (flag thin + info L3), bukan
  # gate. Keputusan ini menunggu keberatan user/reviewer.
  min_liquidity_multiplier: 2.0
  liquidity_hard_min_usd: 25.0
  # Spread bid/ask maksimum (sen) agar garis dianggap bisa dibeli:
  # kuotasi hidup = spread kecil. INITIAL — dari distribusi artefak
  # 22 Nov: garis kandidat (199,5–255,5) berspread 1–3¢, kuotasi
  # mati berspread >= 7¢ (47/54) atau 98¢ (1/99); 5¢ duduk di celah
  # bersih di antara keduanya. RENCANA KALIBRASI: user melaporkan
  # fill nyata di jup.ag (bila spread 5¢ ternyata sering gagal isi,
  # turunkan; bila 5¢ terlalu ketat, naikkan — dengan bukti).
  max_spread_cents: 5.0
  # Stake default per tiket (USD) bila user tidak menyebut angka —
  # dipakai gate likuiditas + audit. Stake nyata user 23 Nov 2026
  # adalah $15 per tiket (2 tiket, total $30).
  stake_default_usd: 15.0

# ── §6c. Cara memilih racikan terbaik ───────────────────────────────────────
optimizer:
  # Urutan: (1) P(rugi total) terkecil, (2) EV gabungan terbesar.
  sort_by: ["p_total_loss_asc", "combined_ev_desc"]
  top_options: 3                # §6c: 3 racikan teratas
  top_option_labels: ["Paling aman", "Seimbang", "Agresif"]
  # Buang pasangan yang Asuransinya tidak bisa menutup modal (syarat §6a).
  drop_if_insurance_cannot_cover: true
  # MAHAL (keputusan user 2026-11-21): kaki MAHAL tidak masuk Tiket
  # Asuransi kecuali user memintanya eksplisit; boleh masuk Tiket
  # Utama, wajib berlabel MAHAL di racikan.
  exclude_mahal_from_insurance: true
  allow_mahal_in_main: true
  mahal_label_required_in_main: true

# ── §6d. Harga kombo ────────────────────────────────────────────────────────
combo:
  spread_cut_pct: 5.5           # §6d default potongan spread kombo 5,5%
  # Kalau user kirim pengali asli jup.ag, pengali itu yang dipakai dan
  # selisihnya disimpan untuk kalibrasi spread (D8, Tahap 4).

# ── §5c. Pembanding pasar (devig & blend) ───────────────────────────────────
blend:
  w_model: 0.3                  # §5c nilai awal w = 0,3 (pasar patokan utama)
  # p_akhir = w * p_model + (1 - w) * p_pasar. w baru naik kalau ledger
  # membuktikan model lebih akurat (kalibrasi §9, atas persetujuan user).
  # Edge per kaki = p_akhir - harga jup.ag (desimal).
  # Laporan menampilkan p_model | p_pasar (+ sumber pembanding) |
  # p_akhir terpisah (keputusan user 2026-11-21).

# ── Aturan pembanding independen (DECISIONS.md, 2026-11-20) ────────────────
comparison:
  # P1: catat provider asal setiap pasar jup.ag (Polymarket/Kalshi/lainnya).
  record_origin_provider: true
  # P2: p_market TIDAK BOLEH dari provider yang sama dengan asal pasar jup.ag.
  forbid_same_provider: true
  # P3: pembanding sah — provider prediction market yang lain + sportsbook.
  allowed_comparison_sources: ["other_prediction_provider", "sportsbook_devig"]
  # Urutan pembanding p_market (keputusan user 2026-11-20, pasca probe 2a):
  # sportsbook (Odds API, devig) -> ESPN odds (devig) -> Kalshi.
  # ESPN odds menunggu konfirmasi probe tambahan 1.
  order: ["odds_api_devig", "espn_odds_devig", "kalshi"]

# ── Label harga (keputusan user 2026-11-21, berlaku Tahap 3) ──────────────
price_labels:
  # Dari EV terhadap harga ¢ jup.ag. DISKON: EV >= +2%. MAHAL: EV < -2%.
  # Di antaranya (-2% <= EV < +2%): WAJAR.
  diskon_min_ev_pct: 2.0
  mahal_max_ev_pct: -2.0
  # MAHAL bukan lagi filter keras (mengganti filter EV < -2% di §7a):
  # kaki MAHAL tetap tampil di laporan; lihat optimizer untuk aturan tiket.

# ── D2. MODEL_ONLY (p_market tidak ada di mana pun) ─────────────────────────
model_only:
  # p_akhir = p_model. Ambang +5 poin lebih ketat (tafsiran D-T1: ambang
  # peluang minimum naik 5 poin). Maks 1 kaki per tiket, dilarang Asuransi.
  p_final_equals_p_model: true
  threshold_penalty_points: 5
  max_legs_per_ticket: 1
  banned_from_insurance: true

# ── B4. TANPA_XG (bola tanpa data xG) ───────────────────────────────────────
no_xg:
  label: "TANPA_XG"
  fallback_model: "Dixon-Coles berbasis gol"
  threshold_penalty_points: 5   # tafsiran D-T1, sama seperti MODEL_ONLY
  banned_from_insurance: true

# ── §5d. Deteksi anomali ────────────────────────────────────────────────────
anomaly:
  jup_vs_market_points: 4.0     # §5d: |jup.ag - pasar lain| > 4 poin
  model_vs_market_points: 8.0   # §5d: |model - pasar| > 8 poin
  # > 8 poin juga memicu bagian wajib "Kenapa beda?" di laporan
  # (keputusan user 2026-11-21; lihat DECISIONS.md).
  sharp_move_cents: 3           # D9: harga berubah >= 3¢ sejak pengambilan pertama

# ── Cek garis market vs model (prinsip psikologi market, 2026-11-22) ───────
market_line_check:
  # v18: total_gap_points (5,0) DIPINDAHKAN ke
  # calibration.lean_to_market_gap (satu sumber kebenaran untuk
  # ambang |median model - garis market| 5,0 poin). Semua pembaca
  # sudah di-point ulang (integrasi koordinator v18):
  # engine/anomaly.py, engine/qa.py, engine/recheck.py,
  # engine/ticket_audit.py, engine/ticket_composer.py.
  # Peluang Under model minimum agar Under dianggap "aman" oleh model
  # dalam cek keselarasan dengan market.
  min_model_under_prob: 0.70

# ── Tangga Polymarket (harga venue jup.ag, Tahap 3 Langkah 1) ──────────────
polymarket_ladder:
  # HEURISTIK AWAL — garis dengan volume kumulatif di bawah ini ditandai
  # "thin" (tipis). Memisahkan garis Alt Under jauh ($5–11) dari garis
  # utama ($403–$41.964) pada contoh DET@ATL 2026-11-22. Volume Gamma
  # adalah kumulatif, jadi ini ukuran kasar, bukan likuiditas saat ini.
  min_volume_usd: 100.0

# ── Mesin analis: bantalan adaptif + nilai wajar (2026-11-23) ─────────────
analis:
  # Harga minimum kaki (estimasi jup.ag, sen) — filosofi user 2026-11-23:
  # Utama WAJIB >= 75¢ (boleh 81–82¢ bila laga butuh lebih aman);
  # Asuransi juga >= 75¢. Garis dipilih dari HARGA dulu, bukan cuma peluang.
  harga_min_utama_cents: 75
  harga_min_asuransi_cents: 75
  # Rumus bantalan adaptif (engine/analis.py bantalan_adaptif):
  #   bantalan = clamp(std_sim * std_factor
  #                    + (ortg_rata_kedua_tim - ortg_liga_rata) * ortg_weight
  #                    + (total_rata_5laga - total_rata_musim) * form_weight,
  #                    min_points, max_points)
  # NILAI AWAL — BELUM DIKALIBRASI. std_factor 0,42 dipilih supaya laga
  # biasa (std sim ~19 poin, sesuai sigma_total hasil fit 18,9868)
  # memberi bantalan ~8 poin (acuan user); ortg_weight + form_weight
  # nilai awal yang menunggu kalibrasi atas data PAPER + persetujuan user.
  # +8 BUKAN lagi aturan kaku: mesin menghitung bantalan per laga, boleh
  # di bawah 8 bila statistik membenarkan, wajib di atas 8 bila laga menuntut.
  cushion:
    acuan_points: 8.0           # acuan user ("+8"), bukan aturan kaku
    std_factor: 0.42            # bobot sebaran sim (dasar bantalan)
    ortg_weight: 0.5            # bobot selisih rating serang vs liga
    form_weight: 0.25           # bobot selisih skor 5 laga vs musim
    min_points: 4.0             # batas bawah bantalan (jangan nol)
    max_points: 20.0            # batas atas bantalan (jangan tak masuk akal)
  # Nilai wajar (engine/analis.py nilai_wajar): "wajar" bila
  # jarak (garis_harga - acuan_sim) - bantalan_dibutuhkan_poin
  # >= selisih_minimum_poin. Nilai 0,0 = garis tempat harga duduk harus
  # menyediakan minimal bantalan yang diminta statistik (tidak ada
  # toleransi tambahan; naikkan hanya atas persetujuan user).
  wajar:
    selisih_minimum_poin: 0.0

# ── Skenario panas (stress) NBA: banjir 3 poin / banjir FT / konservatif ──
stress:
  # Geser TOTAL (poin) yang ditambahkan ke distribusi simulasi di tiap
  # skenario banjir (engine/stress.py: P_skenario(Under L) =
  # CDF_normal(L - geser)). Sigma TIDAK berubah — banjir hanya
  # menggeser lokasi distribusi, bukan menyebarkannya (definisi
  # eksplisit; keterbatasan: banjir nyata mungkin juga melebarkan
  # sebaran — tidak dimodelkan di sini).
  # DASAR DATA (bukan tebakan — diturunkan 2026-11-23 dari game log
  # stats.nba.com musim 2026-27, 20 Okt–22 Nov 2026,
  # leaguegamefinder, 0 kredit Odds API). KOREKSI KONTAMINASI
  # (disetujui user 2026-11-23 12:38 WIB — ini KOREKSI, bukan
  # pelonggaran): nilai lama (13,54/17,54) diturunkan dari snapshot
  # n=247 yang TERCEMAR 4 laga yang sedang berjalan (WL kosong);
  # nilai di bawah ini dari dataset BERSIH n=243 (hanya laga selesai)
  # — lihat LAPORAN-ATURAN-KERAS.md §6 + dataset berdampingan di
  # out/derivasi_setan_2026-11-23.json. Konterfaktual §6: dengan
  # geser bersih, block rate gate banjir tetap 1/10 lolos — jadi
  # koreksi ini BUKAN obat Asuransi yang tidak terbentuk.
  # - banjir_3p: (p90 - rerata 3PM gabungan/laga) x kemiringan OLS
  #   total/3PM, data bersih n=243 = 8,50 (lama 13,54, tercemar).
  #   Kemiringan bersih 1,37 (bukan 2,12): tembakan tiga tambahan
  #   sebagian menggantikan tembakan dua angka.
  # - banjir_ft: (p90 - rerata FTM gabungan/laga) x kemiringan OLS
  #   total/FTM, data bersih n=243 = 12,52 (lama 17,54, tercemar).
  # - Persentil p90 ("1 dari 10 laga") adalah PILIHAN DESAIN — menunggu
  #   keberatan reviewer. Jangkar insiden DEN@CHI 23 Nov 2026 (21
  #   tripoin masuk di halftime, laju 42/laga) berada DI ATAS maks
  #   musim (40; z +2,89, di atas p99) — banjir p90 TIDAK mencakup
  #   insiden separah itu. Garis tahan-banjir p90 menjawab "tahan
  #   banjir 1-dari-10", BUKAN "tahan banjir separah DEN@CHI".
  # - KALIBRASI ULANG: tarik lagi game log musim berjalan, hitung ulang
  #   rerata + p90 + kemiringan OLS, ganti kunci-kunci ini, minta
  #   persetujuan user (seperti D12 untuk parameter fit). Kemiringan
  #   OLS bersifat asosiatif, bukan kausal (ikut menangkap pace/OT).
  # - setan: (MAKS - rerata 3PM gabungan/laga) x kemiringan OLS
  #   total/3PM = (40,00 - 26,79) x 1,37 = 18,07. Deviasi MAKSIMAL
  #   yang pernah teramati (bukan p99): mengikuti kata user
  #   "penyimpangan MAKSIMAL" (09:47 WIB) — p99 (37,00 -> 13,97)
  #   masih menyisakan ~1% laga di luarnya. Laga maks: CHI@NYK
  #   2026-10-28 (40 tripoin, total 260). Dataset: HANYA laga
  #   SELESAI (WL terisi), n=243 — BUKAN n=247: leaguegamefinder
  #   JUGA mengembalikan laga yang sedang berjalan (WL kosong); 4
  #   laga 22 Nov belum selesai saat ditarik (IND@NYK baru 31 poin,
  #   DEN@CHI 171 poin) dan menarik rerata ke bawah + kemiringan ke
  #   atas (kemiringan tercemar 2,12 vs bersih 1,37). Nilai banjir
  #   p90 di atas SUDAH dikoreksi ke data bersih (8,50/12,52) atas
  #   persetujuan user 12:38 WIB — lihat paragraf DASAR DATA di atas.
  #   Detail + dataset: out/derivasi_setan_2026-11-23.json.
  # - PERAN SETAN (koreksi user 09:52 WIB): setan BUKAN gate keras —
  #   gate Asuransi tetap banjir p90 + edge + volume + min_leg_prob.
  #   Setan adalah DETEKSI kerapuhan: kaki dengan P normal >= target
  #   tapi P setan < target ditandai flag_setan (pola DEN@CHI).
  #   Jangkar insiden: laju halftime DEN 42 tripoin/laga MASIH di
  #   atas maks musim (40) — skenario setan mencakup banjir terburuk
  #   yang pernah SELESAI, bukan laju halftime separah itu.
  # - Skenario konservatif tidak butuh kunci di sini: gesernya =
  #   main_total_line - median sim, dihitung per laga (sigma sama).
  # - Target P(Under) garis tahan-banjir dibaca dari kunci yang sudah
  #   ada: tickets.insurance.min_leg_prob (0,74) / tickets.main.
  #   min_leg_prob (0,65) — tidak diduplikasi di sini.
  banjir_3p_points: 8.50
  banjir_ft_points: 12.52
  setan_points: 18.07

# ── Ekor 3 poin per laga di simulasi (engine/nba_sim.py) ─────────────────────
ekor_3p:
  # Model: sigma_total PER LAGA dari laju 3PA gabungan kedua tim
  # (scripts/fit_ekor_3p.py; bukti out/fit_ekor_3p.json):
  #   sigma_total_laga^2 = sigma_total_global^2
  #                        + slope_aktif x (3PA_gabung - rata_liga)
  #   dijepit ke [sigma_min_faktor, sigma_max_faktor] x sigma global.
  # 3PA_gabung = fg3a_per_game kandang + tandang (musim berjalan,
  # dari ingest.nba_brain blok tim "tembakan_3p", sumber BBRef
  # totals-team tier 2). Bila data 3PA salah satu tim tidak ada, sim
  # memakai sigma global + mencatatnya di artefak (fail-closed).
  # HASIL FIT (n=2466 laga, residual rolling point-in-time, laju 3PA
  # point-in-time, 2024-25 s.d. 2026-27): slope varians -0,34 +/- 1,97
  # per 3PA gabungan (t=-0,17) — TIDAK SIGNIFIKAN. Uji yang sama pada
  # varians margin (t=-0,07), |residual| (t=0,16), 3P% (t=-0,24),
  # volatilitas 3PM per tim (t=0,76), share 3PA (t=-0,69), dan
  # varians binomial tersirat (t=-0,22) semuanya juga nol. Kuantil
  # atas residual total di kuartil 3PA tertinggi justru sedikit LEBIH
  # TIPIS (p95 31,2 vs 36,4 di kuartil terendah). Artinya: data TIDAK
  # mendukung klaim "laga dua tim penembak tripoin ekornya lebih
  # gemuk" — efeknya, bila ada, di bawah daya deteksi 2.466 laga
  # (CI 95% slope [-4,20, +3,53] masih mencakup slope binomial
  # teoritis +2,07). Mengikuti preseden altitude (nilai fit dalam
  # noise -> tidak diadopsi), slope AKTIF = 0: sim memakai sigma
  # global untuk semua laga sampai kalibrasi ulang menemukan efek
  # yang terukur. Mesin + datanya sudah terpasang dan teruji; yang
  # berubah saat kalibrasi ulang hanyalah slope_aktif (butuh
  # persetujuan user seperti D12). DEN@CHI 22 Nov 2026: 3PA gabungan
  # pra-laga 71,6 (persentil 29 — DEN tim penembak 3P RENDAH, 30,9
  # per laga) — model laju-3PA APA PUN tidak akan menandai laga itu
  # berisiko; banjirnya adalah lonjakan percobaan (90 vs ~72) +
  # akurasi (46,7% vs ~33%) DI DALAM laga, bukan laju pra-laga.
  # RENCANA KALIBRASI: jalankan ulang scripts/fit_ekor_3p.py tiap
  # akhir musim (n bertambah ~1.230 laga/musim) + saat ada cukup
  # laga musim berjalan; bila |t| >= 2, ajukan slope fit ke user.
  # Tiga_pa_gabungan_rata_liga = pemusat HASIL FIT (mean 3PA
  # gabungan sampel fit, n=2466). Faktor jepit adalah PILIHAN DESAIN
  # (pagar keamanan, bukan hasil fit): sigma per laga tidak boleh
  # kurang dari setengah atau lebih dari dua kali sigma global.
  slope_aktif: 0.0
  tiga_pa_gabungan_rata_liga: 74.54
  sigma_min_faktor: 0.5
  sigma_max_faktor: 2.0

# ── Audit tiket sebelum pasang (engine/ticket_audit.py) ────────────────────
audit:
  # Edge di bawah ini (tapi >= 0) dianggap "tipis" -> kaki PERHATIAN
  # (bukan gate keras). NILAI AWAL 5,0 (5 poin) — dipilih karena kaki
  # DEN Asuransi 23 Nov 2026 (edge +2,5%) adalah kaki terlemah yang
  # akhirnya jebol; menunggu kalibrasi atas data PAPER + persetujuan
  # user. Bukan gate min_edge_pct (tickets.insurance): gate itu memakai
  # edge p_final di peracik, sedangkan audit memakai edge P_model
  # (audit tidak punya blend p_market) — keduanya sengaja tidak
  # disamakan (keputusan koordinator, perbaikan pasca-Denver).
  edge_tipis_pct: 5.0

# ── §7a. Filter keras (kaki langsung dicoret, alasan dicatat) ───────────────
filters:
  all_markets:
    exclude_data_incomplete: true   # §7a: status DATA_INCOMPLETE
    # EV < -2% BUKAN lagi filter keras (keputusan user 2026-11-21):
    # kaki MAHAL tetap tampil dengan label; lihat price_labels.
  moneyline:
    min_p_final: 0.65               # §7a: p_akhir < 65% dicoret
    # Kecuali mode Agresif, dan kaki wajib diberi label (agresif).
    allow_below_min_in_aggressive: true
    aggressive_label_required: true
  nba_alt_under:
    # Salah satu tim peringkat DRtg #23-30 -> coret.
    drtg_bad_rank_from: 23
    drtg_bad_rank_to: 30
    # Kedua tim masuk 10 besar Pace -> coret.
    both_top_pace_n: 10
    # Bantalan ADAPTIF (filosofi user 2026-11-23, menggantikan D10 kaku
    # 8/12 poin berbasis spread — kunci min_cushion_points,
    # min_cushion_points_close_spread, close_spread_threshold DIHAPUS
    # di versi 13): mesin menghitung bantalan per laga dari sebaran sim
    # + kekuatan serang + form skor (section analis, engine/analis.py).
    # Bantalan Asuransi dari target peluang (keputusan user 2026-11-22,
    # patch langkah 1b perbaikan 3): garis terkecil dari tangga yang
    # P_model(Under) >= insurance_target_probability, DI ATAS garis
    # Utama, harga >= analis.harga_min_asuransi_cents, dan TIDAK tipis
    # (volume = penghalang keras). Lantai market+8 (kunci
    # market_cushion_floor_points) DIHAPUS di versi 13 — digantikan
    # syarat "di atas Utama" + harga minimum + volume.
    insurance_target_probability: 0.74
  football_btts_yes:
    min_combined_xg: 2.45           # §7a: total xG gabungan < 2,45 -> coret
  football_lineup:
    # Lineup belum keluar + laga < 60 menit lagi + pemain kunci diragukan.
    lineup_missing_minutes_before_kickoff: 60
    # D11: definisi pemain kunci bola.
    key_player_definition:
      goalkeeper: "kiper utama"
      centre_backs: "2 bek tengah dengan menit terbanyak"
      top_attacker: "pemain xG+xA terbanyak"
      minutes_threshold_pct: 70

# ── D7/D8. Rumus (referensi; implementasi di kode Tahap 3/4) ────────────────
formulas:
  leg_ev: "p_akhir * (100 / harga_cents) - 1"
  combo_multiplier: "prod(100 / harga_cents_i) * (1 - spread_pct / 100)"
  ticket_ev: "P(tiket menang, simulasi gabungan) * pengali - 1"

# ── D14. Mata uang ──────────────────────────────────────────────────────────
currency:
  base: "USD"
  usdc_to_usd: 1.0              # D14: USDC dicatat sebagai USD 1:1

# ── §5. Mesin hitung ────────────────────────────────────────────────────────
simulation:
  iterations: 100000            # §5: 100.000x simulasi per laga
  # D12: parameter TIDAK BOLEH ditebak — fit dari data historis, laporkan
  # hasil fit + backtest, berlaku setelah user setujui.
  fitting:
    history_seasons: "2-3"
    nba_fit_targets: ["margin", "total"]
    football_rho_method: "MLE per liga"
    requires_user_approval: true
    # Ambang minimum data untuk fit NBA (scripts/fit_nba_params.py):
    # di bawah ini parameter ditulis null + alasan, bukan ditebak.
    min_games_total: 100
    min_group_n: 30
  nba:
    distribution: student-t     # §5a: ekor tebal
    # --- HASIL FIT ROLLING point-in-time (diadopsi user 2026-11-22) ---
    # Menggantikan nilai D12 (fit rating musim penuh: sigma_total
    # 18,2198; sigma_margin 13,8168; home 1,6552; B2B -1,596; t_nu
    # 34,5). Nilai rolling dari re-fit yang sama atas rating rolling
    # (hanya laga sebelum tanggal uji — tanpa look-ahead);
    # LAPORAN-FIT-NBA.md §12; bukti out/fit_nba_params_rolling.json.
    # Pergeseran tidak material (sigma +4,2–4,4%). Altitude TIDAK
    # diadopsi (nilai rolling -0,4094 dalam noise, SE 1,14).
    # Sumber: 2701 laga (2024-25 penuh 1230 + 2025-26 penuh 1230 +
    # 2026-27 parsial 241 s.d. 21 Nov 2026); game log stats.nba.com
    # leaguegamefinder + rating Basketball-Reference.
    # Script: scripts/fit_nba_params.py --rolling. Nilai di bawah ini
    # HASIL FIT, bukan tebakan.
    sigma_points: 18.9868       # = sigma total (ringkasan satu angka)
    # Sigma margin & total HASIL FIT. Mesin memakai kedua kunci ini.
    sigma_margin_points: 14.4307  # std residual margin, n=2701
    sigma_total_points: 18.9868   # std residual total, n=2701
    # Derajat bebas Student-t, HASIL FIT (grid MLE 3-50).
    # Profil log-likelihood DATAR di 20-100 (puncak ~35,0): residual
    # nyaris normal (kurtosis lebih 0,16) — ekor tebal tidak terukur
    # kuat di level laga. Nilai 35,0 praktis setara normal.
    t_nu: 35.0
    # Intersep regresi OLS margin ~ selisih net rating (n=2701;
    # re-fit rolling).
    home_advantage_points: 1.6639
    # BERTANDA: selisih rata-rata residual poin tim B2B vs tidak
    # (re-fit rolling) — sim MENAMBAHKAN nilai ini ke poin tim B2B.
    back_to_back_penalty_points: -1.5164
    # Selisih rata-rata residual margin kandang DEN/UTA vs lainnya
    # (n_alt=180, SE 1,10): praktis NOL — tidak ada efek ketinggian
    # tambahan yang terukur di luar home advantage umum.
    altitude_adjustment_points: -0.0105
    # Penyesuaian turnamen (NBA Cup/Playoff): BELUM ADA DATA — 0 sampai
    # difit. Nilai 0 berarti flag turnamen saat ini tidak mengubah proyeksi.
    tournament_adjustment_points: 0.0
    # Skala dampak pemain absen (dampak = BPM x menit/48 x bpm_scale).
    # ASUMSI AWAL 1.0 — BELUM DIFIT (tidak ada literatur internal);
    # berlaku sebagai asumsi yang didokumentasikan, bukan hasil fit.
    bpm_scale: 1.0
    # Level pengganti (replacement level) BPM: pemain absen diganti
    # pemain level pengganti, BUKAN pemain nol — dampak absen =
    # (BPM - bpm_replacement) x menit/48 x bpm_scale x faktor overlap.
    # NILAI -2,0 DARI LITERATUR, bukan hasil fit: Basketball-Reference
    # mendefinisikan -2,0 sebagai "replacement level"
    # (http://basketball-reference.com/about/bpm.html: "-2.0 is a bench
    # player (this is also defined as 'replacement level')"; rumus
    # VORP = [BPM - (-2.0)] x %menit, https://www.sports-reference.com
    # /blog/2014/10/introducing-box-plusminus-bpm-2/).
    # Berlaku sebagai asumsi yang didokumentasikan, bukan hasil fit
    # (seperti bpm_scale); kalibrasi ulang atas data PAPER bila perlu.
    bpm_replacement: -2.0
    # Shrinkage menit + BPM ke musim lalu (patch 1c/Langkah 2, temuan
    # auditor 2): pemain dengan sedikit laga musim ini dicampur
    # dengan musim lalu — bobot musim ini w = n/(n+K), nilai akhir =
    # w*nilai_kini + (1-w)*nilai_lalu, untuk menit DAN BPM.
    # K = 10 laga: PILIHAN DESAIN mengikuti K=10 shrinkage rating
    # rolling (D-R2), BUKAN hasil fit; menunggu keberatan reviewer.
    # Rookie/tanpa data musim lalu: pakai nilai musim berjalan.
    shrinkage_k_games: 10
    # Bobot resensi statistik tim (musim vs 10 laga terakhir).
    # ASUMSI AWAL mengikuti pola §5b bola (60/40) — BELUM DIFIT.
    recency:
      season: 0.6
      last10: 0.4
    tournament_flags: ["NBA Cup", "Playoff"]  # §5a: bendera konteks
    squad_scenarios: ["full", "missing_1", "missing_2", "missing_4"]  # §5a
    overtime_minutes: 5         # §5a: OT 5 menit kalau seri setelah 48 menit
    # Batas periode OT per iterasi (pencegah loop tak hingga; peluang
    # mencapai batas ini praktis nol). Asumsi implementasi, bukan fit.
    ot_max_periods: 5
  football:
    model: dixon-coles          # §5b
    # TANPA_XG (B4, Langkah 5): rantai xG putus (Understat maintenance),
    # jadi bobot di bawah ini dipakai ulang untuk LAJU GOL (bukan xG):
    # laju = 60% musim + 40% 6 laga terakhir — rumus BERSAMA soccer_brain
    # + fit + sim (lihat ingest/soccer_brain.py). Bila xG kembali, bobot
    # ini kembali berarti bobot xG seperti §5b.
    xg_weight_season: 0.60      # §5b: 60% musim
    xg_weight_recent: 0.40      # §5b: 40% 5-6 laga terakhir
    recent_matches: 6           # §5b: 5-6 laga terakhir (pakai 6, batas atas)
    # Jendela tarik hasil musim berjalan (hari ke belakang dari tanggal
    # laga) untuk soccer_brain: 150 hari mencakup awal musim EPL
    # (pertengahan Agustus) sampai akhir November. PILIHAN DESAIN
    # Langkah 5 (bukan hasil fit) — musim EPL berjalan Agu–Mei.
    results_window_days: 150
    dixon_coles_rho: null       # TBD — MLE per liga, Tahap 3 (D12)
    home_advantage_by_league: null  # TBD — fit Tahap 3 (D12)
    absence_penalty: null       # TBD — bek tengah/kiper/striker absen (D12)

# ── Wiring otak bola (Tahap 3 Langkah 5) ───────────────────────────────────
soccer:
  # Liga yang didukung soccer_brain (hanya EPL: satu-satunya liga dengan
  # fetcher JSON resmi + ESPN di repo ini; LaLiga belum — lihat
  # ingest/soccer_brain.py soal apa yang bisa dan tidak bisa).
  leagues_supported: ["EPL"]
  # Path parameter fit Dixon-Coles pekerja A (relatif terhadap root repo).
  # File belum ada = fit menunggu persetujuan = analisis bola
  # DATA_INCOMPLETE (tidak ada parameter contoh sebagai default berjalan).
  fit_params_path: "out/fit_soccer_params.json"
  # D12: parameter fit hanya berlaku setelah user setujui ("approved"
  # true di file fit); sebelum itu artefak bola maksimal HOLD.
  fit_requires_approval: true

# ── Biaya venue ─────────────────────────────────────────────────────────
fees:
  # Koefisien fee taker Kalshi (Fee Schedule resmi Kalshi, berlaku
  # 7 Juli 2026): taker fee = roundup(0,07 x C x P x (1-P)),
  # C = jumlah kontrak, P = harga. Dipakai Tahap 3 untuk mengoreksi
  # harga efektif sebelum label DISKON/WAJAR/MAHAL (MEMORY 2026-11-21).
  kalshi_taker_fee_coeff: 0.07
  # Markup tipikal jup.ag di atas harga Polymarket (median 0,5¢ dari
  # 11/11 pasar yang cocok, probe tambahan 3, 2026-11-20; mean 0,68¢,
  # maks 1,5¢). Perkiraan tipikal untuk harga venue, BUKAN angka pasti
  # per pasar — harga jup.ag asli tetap harus dibaca dari UI/API bila
  # tersedia.
  jup_typical_markup_cents: 0.5

# ── Aturan data (DECISIONS.md B, menggantikan §4) ───────────────────────────
data:
  stale_hours_injury_lineup: 3  # §4: cedera/lineup > 3 jam = "basi", ambil ulang
  recheck_window_minutes: [30, 60]  # §3: cek ulang 30-60 menit sebelum laga
  cross_check_min_sources_injury_lineup: 2  # B2: cedera & lineup min 2 sumber

# ── Cek ulang pra-submit (Tahap 3 Langkah 2) ──────────────────────────────
recheck:
  # Garis total market bergerak > ambang ini sejak analisis awal ->
  # hitung ulang simulasi + garis Asuransi/Utama (keputusan Langkah 2).
  market_line_move_points: 2.0
  # Gerakan harga >= anomaly.sharp_move_cents (3¢) sejak fetch pertama
  # -> ANOMALI + hitung ulang (aturan Thunder; ambang di anomaly,
  # tidak diduplikasi di sini). Cedera inti berubah (pemain OUT/
  # DOUBTFUL baru atau status berubah) -> hitung ulang (tanpa ambang
  # angka: perubahan status apa pun memicu hitung ulang). Data cedera
  # basi: data.stale_hours_injury_lineup (3 jam). Jendela recheck:
  # data.recheck_window_minutes ([30, 60]).

# ── Modul berita NBA (konteks, bukan angka) ──────────────────────────────
news:
  # Jumlah artikel yang ditarik dari feed liga ESPN per panggilan
  # (TERUKUR probe 2026-11-23: limit=50 mengembalikan 50 artikel,
  # terbit 21-23 Nov 2026 = jendela ±2 hari).
  max_items_fetch: 50
  # Umur maksimum berita yang dipakai (jam, dihitung dari jam ambil).
  # NILAI AWAL: 72 jam selaras dengan jendela ±2 hari feed limit=50;
  # berita lebih tua dari ini dianggap basi sebagai konteks laga malam ini.
  max_age_hours: 72
  # Jumlah maksimum berita per laga di artefak/laporan. NILAI AWAL
  # (operasional — supaya bagian Berita tetap bisa dibaca).
  max_items_per_match: 5
  # TTL cache + jeda antar request (sama seperti modul ESPN lain).
  cache_ttl_seconds: 600
  rate_gap_seconds: 1.0

# ── Pantauan live (Tahap 3 Langkah 4) ─────────────────────────────────────
live:
  # NILAI AWAL — BELUM DIKALIBRASI. Ambang status kaki Under dari
  # margin = garis − proyeksi total akhir (poin). Menunggu validasi
  # atas data PAPER + persetujuan user; jangan dipakai untuk keputusan
  # tiket nyata sebelum divalidasi.
  status_margin_aman_points: 6.0
  status_margin_waspada_points: 2.0
  # Risiko OT: laga bisa masuk babak tambahan bila selisih skor ≤
  # ot_risk_margin_points DAN sisa waktu ≤ ot_risk_minutes_remaining.
  # Total bertambah bila OT terjadi — penting untuk kaki Under.
  ot_risk_margin_points: 3
  ot_risk_minutes_remaining: 2.0
  # Ambang anomali live (dipakai pendeteksi anomali live): laga baru
  # dinilai anomalinya setelah menit ke-12; laju tembakan tiga angka /
  # lemparan bebas / skor melebihi pengali ini dari laju pra-laga
  # -> anomali. NILAI AWAL — BELUM DIKALIBRASI.
  anomaly_min_minutes_elapsed: 12
  anomaly_fg3_rate_multiplier: 1.5
  anomaly_ft_rate_multiplier: 1.5
  anomaly_scoring_rate_multiplier: 1.15

# ── Titik equilibrium per kaki (keputusan user 2026-11-23 10:31 + 10:41 WIB) ─
equilibrium:
  # DEFINISI (engine/equilibrium.py — "titik paling manis" per kaki):
  # dari distribusi sim 100.000x (CDF total) + tangga Polymarket, untuk
  # tiap tiket, di antara garis Under yang lolos SEMUA gate tiket itu
  # (min_leg_prob, banjir [Asuransi], edge [Asuransi], volume, lantai
  # harga 75¢ — ambang-ambang yang SUDAH ADA, tidak diduplikasi di sini),
  # pilih garis yang memaksimalkan expected return
  # ER = p_final(garis) x (100 / harga_venue(garis)).
  # Seri (selisih ER < 1e-9): p_final lebih besar, lalu garis lebih kecil.
  # p_final(garis) memakai jangkar pasar: geser pasar δ dari kaki artefak
  # (δ = garis_jangkar − CDF⁻¹(p_market_jangkar)); p_market(garis) =
  # CDF(garis − δ) — asumsi geser-lokasi yang SAMA dengan stress.py
  # (pasar dan model berbeda hanya oleh geseran lokasi). Sumber pembanding
  # tetap Kalshi (jangkar); harga Polymarket hanya dipakai sebagai HARGA,
  # bukan sebagai p_market (aturan P2 dihormati).
  # MENGGANTIKAN aturan lama "garis termurah yang lolos" (cushion +
  # climb banjir): komposer memakai garis equilibrium bila terhitung.
  # Gate banjir komposer tetap berjalan sebagai pertahanan lapis kedua
  # (lolos by construction). Equilibrium BOLEH melompati garis
  # tahan-banjir yang thin ke garis tebal di atasnya (keputusan lama
  # "tidak melompat" digantikan — lihat
  # LAPORAN-EQUILIBRIUM-SKIP-AWAL.md §2).
  # TIDAK ADA floor ER > 1: equilibrium adalah max-ER — titik manisnya
  # pun bisa ber-EV negatif (dilaporkan transparan, bukan disembunyikan);
  # kelayakan TIKET dinilai di tingkat tiket (EV tiket + peringatan).
  # Tanpa CDF / tanpa tangga / tanpa jangkar pasar -> equilibrium TIDAK
  # DIHITUNG (bukan "tidak ada") -> komposer memakai kaki artefak apa
  # adanya (fallback). Kunci ini (false) mematikan equilibrium +
  # mengembalikan perilaku lama persis (untuk pengukuran A/B + rollback).
  enabled: true
  # Bila true (produksi): tanpa kaki artefak bergaris + p_market,
  # equilibrium tidak dihitung — p_final per garis tidak bisa dihitung
  # jujur tanpa jangkar pasar. Jangan ubah ke false tanpa persetujuan
  # user (false berarti memakai p_model sebagai p_final — MODE
  # MODEL_ONLY per garis, yang belum dirancang aturannya).
  butuh_anchor_pasar: true
  # MODE PEMILIHAN PER TIKET (keputusan user 2026-11-23 12:20 + 12:33
  # WIB; engine/equilibrium.py). Nilai yang dikenal: "max_er" dan
  # "safety_first" — nilai lain / kunci hilang -> ConfigError
  # (fail-closed: mode yang salah diam-diam lebih buruk daripada
  # error keras).
  # - mode_insurance: "safety_first" — Asuransi memilih garis dengan
  #   p_final TERTINGGI (paling aman) di antara garis yang lolos
  #   SEMUA gate Asuransi; seri p_final (< 1e-9) -> ER lebih tinggi
  #   -> garis lebih kecil. Alasan user: Asuransi adalah permainan
  #   yang "benar-benar bisa menyelamatkan dari kegagalan Utama" —
  #   titik manisnya adalah yang paling aman, bukan yang nilai
  #   harapannya tertinggi. KONSEKUENSI JUJUR: garis paling aman
  #   adalah garis termahal, jadi pengali per kaki kecil dan Asuransi
  #   butuh LEBIH BANYAK kaki untuk mencapai target x2 — bila tidak
  #   tercapai, tiket tidak terbentuk (fail-closed, jangan paksa).
  #   Kendala pengali tiket (multiplier_min Asuransi x2) tetap
  #   ditegakkan peracik (ticket_composer._pilih_subset), BUKAN di
  #   sini — equilibrium per kaki tidak tahu berapa kaki tiketnya.
  # - mode_main: "max_er" — Utama TETAP max-ER (p_final x 100/harga):
  #   Utama "tidak main brutal — tetap cari titik paling manis pada
  #   grafik" (12:33 WIB).
  mode_insurance: safety_first
  mode_main: max_er

# ── Skip dari awal (keputusan user 2026-11-23 10:22 + 10:41 WIB) ──────────
skip_awal:
  # Laga yang tidak masuk akal dari awal di-SKIP dari KEDUA tiket.
  # Tiga pemicu (engine/skip_awal.py); SATU pemicu positif cukup:
  # (a) tidak_ada_equilibrium — equilibrium TIDAK ADA di KEDUA tiket
  #     (dihitung, bukan gagal hitung). Satu tiket punya equilibrium
  #     -> tidak skip via (a).
  # (b) pola_denver — KONJUNGSI 4 syarat (semua harus benar):
  #     (1) flag_setan pada garis acuan (garis tangga termurah dengan
  #         P normal >= target Asuransi): P normal >= 0,82 tapi
  #         P setan < 0,82 — setan per pemain v18 bila blok
  #         setan_pemain ada, setan generik sebagai fallback;
  #     (2) tidak ada garis yang LOLOS GATE EKSEKUSI yang tahan
  #         banjir pada target Asuransi ("rapuh banjir di semua
  #         garis yang bisa dibeli" — v18.1: cek_eksekusi
  #         menggantikan flag thin volume kumulatif);
  #     (3) garis acuan TIDAK lolos gate eksekusi (v18.1: dulu
  #         "volume tipis" dari flag thin);
  #     (4) EV kecil pada garis acuan (EV < max_ev_for_weak_flag,
  #         -1% — v18.1: dulu edge < edge_kecil_pct 3,5%).
  #     PAGAR ANTI-REDUNDANSI (v18.1): bila laga tidak kena veto
  #     DAN punya garis lolos semua gate Equilibrium Asuransi, pola
  #     hanya boleh menyala bila ketiganya benar: garis Asuransi
  #     rapuh vs setan pemain (P setan < demon_p_fragile_threshold
  #     ATAU median setan > garis Asuransi) + total pasar >=
  #     min_market_total_for_pattern + tidak ada garis valid
  #     (cek_eksekusi + EV >= -1%) yang tahan banjir maupun setan.
  # (c) ot_tinggi — potensi OT tinggi (ambang di section ot_seleksi).
  # Tanpa data yang cukup -> "tidak dievaluasi", BUKAN skip: skip
  # adalah klaim positif soal laga, bukan default saat data hilang
  # (gate per kaki tetap fail-closed seperti sebelumnya).
  # Kunci ini (false) mematikan skip_awal (perilaku lama persis).
  enabled: true
  pola_denver:
    # v18.1 (Patch #1 Gemini — MENGGANTIKAN syarat (4) edge + definisi
    # thin): syarat (4) kini berbasis EV (gagal bila EV < ambang,
    # selaras gate EV Asuransi -1%); "non-thin" kini berarti lolos
    # gate eksekusi (cek_eksekusi: likuiditas >= $30 + spread <= 5¢
    # + ask nyata), BUKAN flag thin volume kumulatif; flag setan
    # kini memakai setan per pemain v18 (cap min(50%, 3P% + 12pp),
    # fallback setan generik bila blok setan_pemain tidak ada).
    # Pagar anti-redundansi: bila laga tidak kena veto DAN punya
    # garis lolos semua gate Equilibrium Asuransi, pola hanya boleh
    # menyala bila ketiga syarat pagar benar (garis Asuransi rapuh
    # vs setan pemain + total pasar tinggi + tidak ada garis valid
    # yang tahan banjir maupun setan).
    use_ev_instead_of_flat_edge: true
    # EV terburuk (pecahan; -0,01 = EV >= -1%) agar syarat (4)
    # TIDAK menyala — selaras tickets.insurance.max_negative_ev_pct.
    max_ev_for_weak_flag: -0.01
    use_cek_eksekusi_for_thin: true
    use_demon_per_player_v18: true
    # P(setan pemain) di bawah ini = garis Asuransi "rapuh" (pagar
    # syarat 1 + definisi "tahan setan" pagar syarat 3). INITIAL —
    # BELUM DIKALIBRASI (proposal Gemini §3); rencana kalibrasi:
    # ukur distribusi P setan pemain pada garis Asuransi di laga
    # yang banjir vs tidak dari hasil settled; geser hanya atas
    # persetujuan user.
    demon_p_fragile_threshold: 0.55
    # Total pasar minimum agar pola Denver boleh menyala di bawah
    # pagar (pagar syarat 2) — selaras vonis.veto.total_tinggi_points
    # (232,0): pola hanya relevan di lingkungan skor tinggi.
    min_market_total_for_pattern: 232.0
    # DEPRECATED v18.1 — TIDAK DIBACA bila
    # use_ev_instead_of_flat_edge true (jalur utama). Dipakai hanya
    # sebagai fallback bila flag itu false (reversibilitas satu
    # baris config), dan dibaca scripts/ukur_equilibrium.py untuk
    # pelaporan. NILAI AWAL (INITIAL) — cermin proposal D12.
    edge_kecil_pct: 3.5

# ── Vonis per laga (keputusan user 2026-11-23 12:38 WIB; ROMBAK v18) ─────
vonis:
  # Mesin menghitung vonis per laga NBA dari DATA (bukan perasaan):
  # HIJAU (kandidat Asuransi), MENENGAH_HIJAU (kandidat Utama),
  # KUNING/lempar koin (skip dari kedua tiket), TUNGGU_LINEUP
  # (tahan — bintang Questionable, lihat subsection tunggu_lineup).
  # Aturan persis di engine/vonis.py + LAPORAN-VONIS-V18.md.
  # ── ROMBAK v18 (audit Gemini §2.2/§2.7 + keputusan user 13:57
  # WIB): sistem demerit DIRAMPINGKAN dari 9 indikator ke 6 (tiap
  # indikator lemah = 1 demerit), dan HIJAU kini menuntut BUKTI
  # POSITIF (minimal 1 "rem alami"), bukan sekadar absennya bahaya:
  #   HIJAU = 0 veto + <= hijau_max_demerits demerit + >= 1 rem alami
  #   MENENGAH_HIJAU = <= menengah_max_demerits demerit
  #     (atau 0–1 demerit TANPA rem alami)
  #   KUNING = >= 4 demerit ATAU pemicu keras (veto / OT empiris
  #     ekstrem / data wajib hilang).
  # YANG DIHAPUS di v18 (alasan di referensi audit §1–§2):
  #   - edge_hijau_pct (demerit edge kecil): edge datar menghukum
  #     kaki harga tinggi secara aljabar (§1.2); nilai kini dinilai
  #     lewat EV di gate per kaki (tickets.*.max_negative_ev_pct),
  #     bukan di vonis laga.
  #   - p_setan_hijau (demerit setan terpisah): banjir + setan
  #     mengukur hal yang sama (kerapuhan ekor) — digabung jadi 1
  #     demerit tail_fragility; setan per pemain tetap jadi flag
  #     diagnostik (worker C), bukan demerit.
  #   - gap_kecil_pct (demerit gap < 4): menghukum kesepakatan
  #     model-vs-pasar justru membuang laga paling bersih (§1.3 —
  #     Brier total model belum terbukti mengalahkan pasar).
  #   - pemakaian min_volume di vonis (demerit volume tipis / tidak
  #     diketahui): volume adalah sifat orderbook, bukan cacat laga
  #     — pindah ke gate eksekusi (section execution).
  #   - veto_total_tinggi_points / veto_pace_tinggi (v17, logika OR):
  #     digantikan subsection veto di bawah (logika AND).
  #   - max_demerit_menengah: digantikan hijau/menengah_max_demerits.
  # AMBANG YANG DIPAKAI ULANG (tidak diduplikasi di sini): gap besar
  # = anomaly.model_vs_market_points (8,0 poin); ambang OT keras =
  # ot_seleksi.hard_skip_ot_prob (0,085); sigma margin OT empiris =
  # simulation.nba.sigma_margin_points.
  # Kunci ini (false) mematikan vonis di komposer (perilaku lama
  # persis: tidak ada laga yang dikeluarkan karena vonis; laporan
  # tetap menampilkan vonis bila dihitung).
  enabled: true
  # ── (a) Kerapuhan ekor GABUNGAN (1 demerit): P(Under) di banjir
  # 3P pada garis REFERENSI < p_flood_3p_below ATAU di banjir FT <
  # p_flood_ft_below. v18.1 (Patch #5a): garis referensi = garis
  # tangga TERENDAH dengan harga >=
  # tail_fragility_reference_price_min (82¢) yang LOLOS gate
  # eksekusi (cek_eksekusi) — BUKAN garis equilibrium Asuransi
  # (plafon ~88,5¢) tempat hampir semua laga tampak tahan banjir.
  # Filter eksekusi WAJIB: tangga artefak memuat garis jauh dengan
  # harga sampah (mis. U117,5 @82,5¢, ask 99¢, likuiditas $3,80
  # di DET@ATL live) — tanpa filter, garis referensi jatuh ke
  # garis yang tidak bisa dibeli. Bila tidak ada garis yang
  # memenuhi, fallback ke garis Asuransi + dicatat di indikator.
  tail_fragility:
    p_flood_3p_below: 0.72
    p_flood_ft_below: 0.67
  # Harga venue minimum (pecahan; 0,82 = 82¢) garis referensi
  # tail_fragility (v18.1, proposal Gemini §3 — INITIAL; rencana
  # kalibrasi ledger: ukur win rate kaki per pita P banjir di
  # garis referensi dari hasil settled).
  tail_fragility_reference_price_min: 0.82
  # ── (b) Total tinggi: garis bandar (main_total_line) >= nilai ini
  # -> demerit. TETAP 235,0 (v17, FIT slate 22 Nov: DEN 236,5/237,5
  # di atas, tertinggi berikutnya OKC 231,5). Klaim "total tinggi =
  # variasi lebih besar" BELUM TERBUKTI (sim memakai satu
  # sigma_total global) — indikator sekunder, 1 demerit.
  total_tinggi_points: 235.0
  # ── (d) Ekor gemuk DIPERKETAT (v17: >= 10 poin DAN <= 85¢):
  # jarak garis Asuransi ke total pasar >= min_offset_points DAN
  # harga venue <= max_price_cents -> demerit. Alasan (§2.2):
  # di sigma ~19, jarak +14 s.d. +16 memang wajar di 80–84¢, jadi
  # ambang lama menyala di laga normal. Nilai 16,0/80 dari proposal
  # Gemini §3 (INITIAL + kalibrasi ledger: win rate kaki Under pada
  # laga ber-sinyal vs tidak dari hasil settled).
  ekor_gemuk:
    min_offset_points: 16.0
    max_price_cents: 80
  # ── (e) Lingkungan foul tinggi: FTr GABUNGAN >= ftr_p80 ->
  # demerit. DEFINISI "GABUNGAN" (diputuskan worker A v18, menunggu
  # keberatan): rata-rata aritmetik FTr musim kedua tim
  # (FTr = FTA/FGA per tim, dari stats_season.ftr). Rata-rata
  # dipakai karena kedua tim sama-sama menyumbang lemparan bebas
  # ke total laga; alternatif (maks / jumlah) ditolak — maks
  # menghukum satu tim pelanggar, jumlah menggandakan skala.
  # ftr_p80 + ftr_p50 FIT dari data liga (bukan tebakan):
  # stats.nba.com leaguedashteamstats Base+Advanced musim 2026-27,
  # ditarik 2026-11-23T07:03:56Z, n=30 tim, snapshot
  # out/fit_cutoff_liga_v18.json; persentil interpolasi linear
  # (metode numpy default). ftr_p50 dipakai rem alami (3) di bawah.
  # RENCANA KALIBRASI: tarik ulang tiap ~20 laga liga / tiap
  # perubahan rotasi besar; bila cutoff bergeser > 0,01, ajukan
  # nilai baru ke user (pola D12). Cutoff FIT dari data MUSIM
  # BERJALAN (parsial ~15 laga/tim) — akan bergeser seiring musim.
  foul:
    ftr_p80: 0.308111
    ftr_p50: 0.274398
  # ── (f) Spread tipis: |spread| <= nilai ini -> demerit (risiko
  # clutch/OT). Spread = |median margin sim| (poin). Nilai 3,0
  # dari proposal Gemini §3 (INITIAL + kalibrasi ledger: frekuensi
  # OT + win rate Under per pita spread dari hasil settled).
  spread_tipis_max: 3.0
  # ── (c) Gap besar (TIDAK punya kunci sendiri — ambang dipakai
  # ulang dari anomaly.model_vs_market_points, 8,0 poin): gap
  # model-vs-pasar > 8,0 HANYA jadi demerit bila TANPA cedera baru
  # terverifikasi (tidak ada entri OUT terkonfirmasi yang melibatkan
  # pemain berdampak: BPM >= +2,0 atau USG >= 24%); bila ada cedera
  # berdampak -> flag investigasi saja, bukan demerit (aturan
  # persis di engine/vonis.py). Ambang pemain berdampak dipakai
  # ulang dari subsection tunggu_lineup di bawah.
  # ── Batas demerit (proposal Gemini §3; INITIAL + kalibrasi
  # ledger: ukur win rate kaki per jumlah demerit dari hasil
  # settled; geser hanya atas persetujuan user).
  hijau_max_demerits: 1
  menengah_max_demerits: 3
  # ── REM ALAMI (bukti positif keamanan — HIJAU butuh >= 1).
  # Tiap rem dicatat mana yang terpenuhi di indikator vonis; bila
  # datanya tidak tersedia (artefak lama), rem itu
  # "tidak_dievaluasi" (bukan gagal). Definisi persis (5 rem):
  #   (1) pertahanan Top-10 ATAU pace Bottom-12: salah satu tim
  #       punya DRtg musim <= drtg_top10_cutoff ATAU pace musim
  #       <= pace_bottom12_cutoff. CATATAN ARAH PACE: pace lambat =
  #       angka pace KECIL — Bottom-12 berarti 12 tim paling lambat,
  #       jadi pace <= cutoff (bukan >=). Kedua cutoff FIT dari
  #       data liga yang sama dengan foul di atas (DRtg terkecil
  #       ke-10 = 112,9; pace terkecil ke-12 = 98,91; n=30).
  #   (2) pencetak utama OUT di KEDUA tim: tiap tim kehilangan
  #       minimal satu pemain OUT terkonfirmasi (status OUT, >= 2
  #       sumber) dengan USG >= usg_scorer_out. USG dari
  #       ingest/pemain_usg.py (cache satu-proses); bila USG tidak
  #       tersedia, rem ini tidak_dievaluasi (BPM TIDAK dipakai
  #       sebagai pengganti — USG dan BPM mengukur hal berbeda).
  #   (3) paint utuh + blowout ATAU kedua tim FTr rendah: (tidak
  #       ada rim protector OUT di kedua tim DAN |spread| >=
  #       blowout_spread) ATAU (FTr kedua tim < foul.ftr_p50).
  #       "Rim protector OUT" memakai pemetaan yang sama dengan
  #       veto (status OUT apa pun sumbernya — di sini tidak
  #       menuntut 2 sumber karena ini bukti positif, bukan veto;
  #       bila data cedera tidak ada, rem ini tidak_dievaluasi).
  #   (4) selaras pasar: |median model - total pasar| <=
  #       market_align_max_gap DAN total pasar <=
  #       market_align_max_total. (Klausul Gemini "atau > 5,0
  #       dengan alasan cedera segar" TIDAK diadopsi di v18 —
  #       penyusutan pre-vonbis worker B sudah menangani gap besar
  #       beralasan; menunggu keberatan.)
  # Nilai blowout_spread 8,5 / market_align_* dari proposal Gemini
  # §3 (INITIAL + kalibrasi ledger); usg_scorer_out 0,25 dari
  # proposal yang sama.
  rem_alami:
    drtg_top10_cutoff: 112.9
    pace_bottom12_cutoff: 98.91
    usg_scorer_out: 0.25
    blowout_spread: 8.5
    market_align_max_gap: 5.0
    market_align_max_total: 228.0
  # ── VETO RIM PROTECTOR (pemicu keras -> KUNING, blokir KEDUA tiket)
  # v18: logika AND (keputusan user #4, 2026-11-23 13:59 WIB —
  # "pake AND yang diusulkan gemini, aku setuju"). Veto menyala
  # HANYA bila KETIGA kondisi benar: rim protector OUT terkonfirmasi
  # (status OUT, >= 2 sumber) + garis pasar >= total_tinggi_points
  # + pace tercepat >= pace_tinggi. Logika OR v17 memblokir
  # OKC@MIA hanya karena pace MIA (102,19) tanpa memperhitungkan
  # hilangnya SGA & Giannis di sisi serangan (false positive yang
  # dikeluhkan user). Bila HANYA satu kondisi lingkungan menyala,
  # veto TIDAK menyala tapi hasil veto mencatat
  # "peringatan_parsial": true + kondisi mana yang menyala (worker B
  # memakai ini untuk +3 bantalan). AMBANG INITIAL (Gemini §3):
  # dipasang dari 2 titik data (DEN 236,5/103,22 vs OKC 231,5/
  # 102,19) — risiko overfitting, baru teruji di 10 baris.
  # RENCANA KALIBRASI (ledger): kumpulkan laga dengan rim protector
  # OUT + hasil settled; ukur win rate Under per pita
  # (garis, pace); geser ambang hanya atas persetujuan user.
  # Balik ke OR adalah perubahan satu baris config (logic: "OR")
  # bila user membatalkan — kode mendukung kedua logika.
  # KONTEKS (tetap): Nic Claxton (CHI, 1,0 blok/laga) OUT vs Jokic
  # terkonfirmasi 2 sumber di artefak verif DEN@CHI — veto HARUS
  # menyala di laga itu (garis 236,5 + pace 103,22).
  veto:
    logic: "AND"
    total_tinggi_points: 232.0
    pace_tinggi: 100.5
    # ── Definisi rim protector (dipakai
    # scripts/fetch_rim_protector.py untuk menurunkan
    # config/rim_protector_2026-27.json) ──
    # v18: filter POSISI (proposal Gemini §2.3) — aturan BPG murni
    # v17 menamai guard di tim yang bloknya lemah (DET: Cade
    # Cunningham 0,9; juga Jamal Murray / Haliburton masuk daftar
    # v17). Posisi dari BBRef (kolom "pos" tabel per-game) karena
    # leaguedashplayerstats stats.nba.com TIDAK mengembalikan posisi
    # (terverifikasi live 2026-11-23: tidak ada kolom POSITION di
    # header respons). Nilai posisi dinormalisasi (huruf besar,
    # spasi dibuang); "F-C"/"C-F" diterima. Ambang diperketat dari
    # v17 (MP 15 -> 18, BLK 0,8 -> 1,0) per proposal Gemini §3.
    # Per tim maksimal max_per_team pemain, urut BPG tertinggi
    # (seri -> menit -> nama). KENAPA TOP-2: perlindungan ring
    # adalah pekerjaan rotasi; selisih BPG #1 vs #2 sering di dalam
    # noise (CHI: Jalen Smith 1,1 vs Nic Claxton 1,0). KENAPA
    # min_games = 3: pemain bintang yang cedera (Chet Holmgren 3
    # laga, Jaren Jackson Jr. 4 laga) tidak bisa diidentifikasi
    # bila ambangnya 5 — dan merekalah yang justru perlu ditangkap
    # veto. KETERBATASAN: pemain 0–2 laga tidak bisa
    # diidentifikasi; alasan veto selalu menyebut nama + angka
    # bloknya supaya bisa diaudit.
    rim_protector:
      position_filter: ["C", "PF", "F-C", "C-F"]
      min_mp_per_game: 18.0
      min_blk_per_game: 1.0
      min_games: 3
      max_per_team: 2
  # ── BANTALAN VETO PARSIAL (v18, worker B): bila hanya SATU kondisi
  # veto menyala (peringatan parsial — logika AND tidak memblokir),
  # kaki laga itu wajib garis >= garis_acuan_normal + nilai ini
  # (engine/ticket_composer.py::_pilih_garis_veto_parsial). Nilai 3,0
  # dari proposal Gemini §3 (INITIAL — belum dikalibrasi; rencana:
  # ukur hasil kaki parsial di ledger PAPER).
  veto_parsial_bantalan_points: 3.0
  # ── Flag volume 3P (untuk worker C — engine/setan_pemain.py):
  # kedua tim masuk Top-10 3PAr -> flag 3P Volume Risk. Cutoff FIT
  # dari data liga yang sama dengan foul di atas (3PAr terbesar
  # ke-10 = 0,457207; n=30; snapshot out/fit_cutoff_liga_v18.json).
  # RENCANA KALIBRASI: sama seperti foul (tarik ulang berkala).
  # NAMA KUNCI: "tiga_pa_rate_top10_cutoff" (bukan "3par_...") —
  # menyesuaikan kode worker C yang sudah mendarat
  # (engine/setan_pemain.py membaca kunci ini; LAPORAN-VONIS-V18.md
  # §Koordinasi).
  tiga_pa_rate_top10_cutoff: 0.457207
  # ── TIMING GATE (TUNGGU_LINEUP): bintang Questionable (status
  # QUESTIONABLE) dengan USG >= usg_bintang ATAU BPM >= bpm_bintang
  # -> laga ditahan di vonis "tunggu_lineup" (bukan HIJAU/KUNING)
  # sampai injury report final ~30 menit sebelum tip-off
  # (proposal Gemini §2.2/§2.8; contoh: IND@NYK — KAT & Siakam
  # Questionable). USG dari ingest/pemain_usg.py (cache
  # satu-proses); bila fetch USG gagal -> fallback BPM saja +
  # dicatat. BPM dari inputs pemain artefak. Ambang dari proposal
  # Gemini §3 (INITIAL + kalibrasi ledger: seberapa sering
  # Questionable bintang akhirnya OUT vs main, dan dampaknya ke
  # hasil Under).
  tunggu_lineup:
    usg_bintang: 0.24
    bpm_bintang: 2.0
    # KUALIFIKASI JALUR USG (v18, keputusan desain worker A — menunggu
    # keberatan; bukti: slate 22 Nov, 2 dari 6 pemicu timing gate
    # adalah pemain pinggiran — RayJ Dennis ATL USG 26,7% tapi BPM
    # -3,2 / 11,5 mnt, Felix Okpara WAS USG 25,0% BPM -6,7 / 1,7
    # mnt. USG tanpa konteks menit + kualitas menangkap pemain
    # garbage-time). "Pemain berdampak via USG" = USG >= ambang DAN
    # mp_per_game >= mp_min_rotasi DAN BPM >= bpm_min_jalur_usg
    # (bila BPM diketahui; BPM hilang -> lantai dilewati, bukan
    # gagal — tidak ada bukti negatif. mp hilang -> jalur USG TIDAK
    # AKTIF: USG tanpa menit tidak bisa ditafsirkan).
    # Definisi ini DIBAGI timing gate + rem alami (3) + aturan gap
    # besar ("satu definisi pemain berdampak" — lihat
    # engine/vonis.py::_lolos_jalur_usg).
    mp_min_rotasi: 10.0  # = setan_pemain.ambang_menit_rotasi (definisi rotasi mesin)
    bpm_min_jalur_usg: 0.0  # BPM 0 = rata-rata liga menurut konstruksi BPM
    # SIMETRI D7 (v18.1, Patch #5b — proposal Gemini §3): filter
    # menit minimal yang SAMA (15,0) untuk KEDUA jalur bintang
    # TUNGGU_LINEUP (USG >= 0,24 DAN BPM >= +2,0). Jalur BPM v18
    # tidak punya filter menit sama sekali; jalur USG memakai
    # mp_min_rotasi 10,0. Nilai 15,0 dari proposal Gemini §3
    # (INITIAL + kalibrasi ledger: seberapa sering Questionable
    # bintang akhirnya OUT vs main per pita menit). mp_min_rotasi
    # (10,0) TETAP dipakai definisi "pemain berdampak via USG" di
    # LUAR timing gate (rem alami + aturan gap besar) — hanya
    # timing gate yang memakai 15,0 simetris.
    min_minutes_pg_all_paths: 15.0

# ── Hard veto (v18.1, Patch #3) ────────────────────────────────────────────
# Section ini HANYA berisi tier fallback pemetaan rim protector.
# Definisi PRIMER rim protector tetap di vonis.veto.rim_protector
# (position_filter, min_mp_per_game 18,0, min_blk_per_game 1,0,
# min_games 3, max_per_team 2) — pemisahan ini sesuai spesifikasi
# patch v18.1 (REFERENSI-PATCH-V18-1-GEMINI.md §3); konsolidasi ke
# satu section adalah keputusan desain yang menunggu keberatan
# (lihat LAPORAN-V18-1-C.md).
hard_vetoes:
  rim_protector_veto:
    # Tier fallback (v18.1): tim yang menghasilkan 0 pemain primer
    # mendapat top-1 big (posisi sama, GP >= min_games primer)
    # dengan ambang di bawah ini, berlabel tier "fallback" di JSON.
    # Diagnosa v18.1: 9 tim hilang BUKAN karena mapping/normalisasi
    # melainkan karena big rotasi terbaik mereka hanya 0,8-0,9
    # blok/laga. Ambang 0,7 dari proposal Gemini §3 (INITIAL —
    # belum dikalibrasi; rencana: ukur seberapa sering rim
    # protector fallback OUT berkorelasi dengan jebolnya Under di
    # ledger PAPER, lalu putuskan ambang final atas persetujuan
    # user). Fallback TIDAK melonggarkan filter posisi/min_games.
    fallback_tier_enabled: true
    fallback_min_minutes_pg: 18.0
    fallback_min_bpg: 0.7

# ── Peluang OT dipakai di seleksi (keputusan user 2026-11-23 10:22 WIB; ROMBAK v18) ───
ot_seleksi:
  # v18: OT EMPIRIS (audit Gemini §1.4 + §2.10). Pemicu keras v17
  # (skip_ot_prob 0,028 atas ot_probability SIM) DIHAPUS — CACAT:
  # kap teoretis P(OT) sim di spread 0 hanya 2,74% (densitas t(35)
  # di 0 = 0,3961 / 14,4307), jadi ambang 2,8% BERADA DI ATAS kap
  # dan hanya mendeteksi noise Monte Carlo (kasus DET@ATL 2,89%).
  # Sim MEREMEHKAN OT (1,7–2,9% vs laju nyata NBA ~5,5–6,0%)
  # karena strategi clutch Q4 (foul, tembakan 3 poin) tidak
  # dimodelkan. Vonis + skip_awal kini memakai
  # engine/ot_empiris.probabilitas_ot_empiris (spread -> peluang
  # OT empiris); ot_probability sim tetap dicatat sebagai INFO.
  # Rumus (docstring engine/ot_empiris.py): p_ot = base_rate_ot x
  # exp(-spread^2 / (2 x sigma_margin^2)), spread = |median margin
  # sim|, sigma_margin dipakai ulang dari simulation.nba
  # (HASIL FIT 14,4307 — bukan parameter baru).
  mode: "empiris"
  # Laju dasar OT NBA (PRIOR, bukan fit — didokumentasikan):
  # ~5,5–6,0% adalah laju OT umum NBA (angka umum yang dipakai
  # Gemini §1.4; 0,0575 = titik tengah). BUKAN hasil fit dari data
  # repo: gamelog stats.nba.com (leaguegamefinder, 2.701 laga fit)
  # TIDAK membawa flag OT (hanya PTS/WL/MATCHUP), jadi fit dari
  # data historis belum bisa dilakukan. RENCANA FIT: kumpulkan flag
  # OT per laga (boxscore BBRef / ESPN — tiap laga selesai dicatat
  # OT/tidak + spread penutupnya), lalu fit laju dasar + sensitivitas
  # spread per pita; berlaku hanya atas persetujuan user (pola D12).
  base_rate_ot: 0.0575
  # Hard-skip hanya bila p_ot empiris >= nilai ini (INITIAL, dari
  # proposal Gemini §3). TEMUAN JUJUR v18 (LAPORAN-VONIS-V18.md):
  # dengan rumus densitas di atas, p_ot MAKSIMUM (spread 0) =
  # base_rate_ot = 0,0575 < 0,085 — ambang ini TIDAK TERJANGKAU
  # rumus saat ini, jadi hard-skip OT DORMAN sampai kalibrasi
  # ledger menyediakan laju OT per pita spread (yang bisa menaikkan
  # laju laga pick'em di atas 0,085) ATAU ambang diturunkan atas
  # persetujuan user. Ini disengaja: gate yang tidak bisa
  # dibuktikan tidak boleh membunuh laga diam-diam. DET@ATL
  # (spread ~2) TIDAK hard-skip (p_ot ~0,057) — kasus uji wajib.
  hard_skip_ot_prob: 0.085

# ── §9. Ledger & kalibrasi ──────────────────────────────────────────────────
calibration:
  report_every_legs: 50         # §9: laporan kalibrasi setiap 50 kaki
  # Laporan kalibrasi membandingkan akurasi (Brier) model vs pasar
  # (keputusan user 2026-11-21); kenaikan w hanya atas persetujuan user.
  compare_brier_model_vs_market: true
  # Sampel minimum kaki settled (dengan p_model DAN p_market) agar
  # engine/calibration.py boleh mengusulkan w baru. Di bawah ini,
  # w_rekomendasi None. Sama dengan report_every_legs (§9: kalibrasi
  # Brier tiap 50 kaki). Rekomendasi TIDAK diterapkan otomatis.
  min_legs_w: 50
  # ── v18: lean-to-market + penyusutan pre-vonbis ──────────────
  # Ambang |median model - garis market| (poin) di atas mana model
  # dianggap menyimpang dari pasar: tanpa penyebab cedera baru,
  # median disusutkan ke arah pasar SEBELUM vonis + equilibrium
  # (proposal Gemini §2.8 — pindahkan Vegas Sanity Check ke tepat
  # setelah sim, jangan hanya di tahap akhir Asuransi). Nilai 5,0
  # TETAP (dipindahkan dari market_line_check.total_gap_points —
  # satu sumber kebenaran; semua pembaca sudah di-point ulang di
  # integrasi v18). NILAI AWAL — BELUM DIKALIBRASI (kira-kira
  # sepertiga sigma total 18,22 poin); menunggu validasi atas data
  # PAPER + persetujuan user.
  lean_to_market_gap: 5.0
  # True = terapkan penyusutan median ke pasar sebelum vonis bila
  # gap > lean_to_market_gap tanpa cedera baru terverifikasi
  # (worker B — engine yang menerapkan; vonis membaca median yang
  # sudah disusutkan dari artefak).
  apply_shrinkage_pre_verdict: true
  # Cara penyusutan (keputusan desain worker B v18 — engine/vegas.py,
  # menunggu keberatan user/reviewer; LAPORAN-GATE-V18.md §Vegas):
  # mode "setengah_jarak" + fraction 0,5 = median digeser setengah
  # jarak menuju garis pasar. Alasan B: pasar NBA efisien (selisih
  # besar tanpa sebab cedera lebih mungkin berarti model meleset),
  # tapi model punya informasi independen yang tidak boleh dibuang
  # sepenuhnya. KALIBRASI (B): kumpulkan median pra/pasca-susut +
  # total aktual dari slate PAPER; ukur Brier/MAE total pada tiap
  # fraction (0,25/0,5/0,75/1,0); pilih yang paling akurat, hanya
  # atas persetujuan user. Nilai di sini SAMA dengan pilihan B yang
  # sudah mendarat di engine/vegas.py (bukan lagi placeholder).
  shrinkage:
    mode: "setengah_jarak"
    fraction: 0.5
  # ── v18.1 (Patch #4): filter kesegaran _sebab_cedera_baru ──
  # Pemain OUT hanya dihitung penyebab gap cedera baru bila
  # games_played musim berjalan >= nilai ini. Pemain GP < 3
  # (termasuk GP == 0 — absen sejak awal musim, mis. Haliburton)
  # sudah 100% terserap harga pasar Vegas sehingga TIDAK boleh
  # membatalkan shrinkage. GP dari inputs pemain artefak
  # (field "games_played", BBRef via nba_brain); GP tidak tersedia
  # -> TIDAK segar (fail-closed ke arah shrinkage berjalan) +
  # dicatat. Nilai 3 dari proposal Gemini §3 (INITIAL — selaras
  # vonis.veto.rim_protector.min_games = 3; rencana kalibrasi:
  # ukur akurasi median pasca-susut pada laga dengan bintang OUT
  # per pita GP dari hasil settled).
  fresh_injury_min_gp_season: 3

# ── §9. Belajar dari hasil (Tahap 3 Langkah 6) ─────────────────────────────
learning:
  # Ambang sampel minimum per pasar agar usulan jenis "pasar" (aturan
  # (a): model kalah dari frekuensi dasar) dan "ambang" (aturan (c):
  # EV prediksi terlalu optimis) boleh diajukan (engine/proposals.py).
  min_n_pasar: 20
  # Ambang sampel minimum per pasar agar usulan "kalibrasi" (aturan
  # (b): model mengalahkan market di pasar itu) boleh diajukan. Sama
  # dengan calibration.min_legs_w: klaim "model lebih baik dari pasar"
  # butuh sampel sebesar kalibrasi w.
  min_n_kalibrasi_pasar: 50
  # Selisih EV terealisasi vs EV prediksi (desimal; 0,05 = 5 poin)
  # yang memicu usulan "ambang" (aturan (c)): EV terealisasi rata-rata
  # di bawah EV prediksi rata-rata minus nilai ini -> EV prediksi
  # terlalu optimis, tinjau ambang EV / label harga.
  ev_gap_warn: 0.05
  # Ambang keyakinan usulan dari n (engine/proposals.py): n <
  # sedang_min -> "rendah"; sedang_min <= n < tinggi_min -> "sedang";
  # n >= tinggi_min -> "tinggi".
  keyakinan_n:
    sedang_min: 20
    tinggi_min: 50

# ── Setan per pemain (build 2026-11-23; LAPORAN-SETAN-PEMAIN.md) ───────
# Uji stress deviasi tripoin berbasis data pemain (engine/setan_pemain.py
# + ingest/pemain_3p.py) — MENGGANTIKAN setan umum (stress.setan_points)
# sebagai demon utama bila data pemain tersedia; setan umum tetap jadi
# fallback bila data pemain tidak tersedia. BUKAN prediksi — uji
# stress (batas atas) untuk DETEKSI kerapuhan; regresi ekor 3P
# (LAPORAN-EKOR-3P.md, n=2.466) menemukan laju 3PA tidak memengaruhi
# ekor total, dan setan per pemain tidak bertentangan dengan itu.
# ── ROMBAK RUMUS v18 (audit Gemini §2.6 — worker C): rumus v17
# (demon per pemain = percobaannya x % 3P TERBAIK liga, 54,1% Cam
# Spencer untuk SEMUA pemain rotasi) membuat terlalu banyak laga
# biasa tampak rapuh. Rumus v18: % 3P setan per pemain =
# min(cap_pct, % 3P musim pemain + boost_pp poin persentase), yaitu
# min(50%, 3P% + 12pp). Kunci pct_terbaik_min_total_3pa DIHAPUS
# (tidak dipakai lagi dengan rumus cap). Flag volume 3PAr
# (add_3par_volume_flag): bila kedua tim masuk Top-10 3PAr (cutoff
# vonis.tiga_pa_rate_top10_cutoff), catat flag 3P Volume Risk — pemicu
# ledakan volume seperti DEN@CHI (90 percobaan vs ~72 ekspektasi).
# KOORDINASI: engine/setan_pemain.py (worker C) yang menerapkan
# rumus baru ini; nilai-nilai di bawah dari proposal Gemini §3
# (INITIAL + kalibrasi ledger: apakah kaki DEN@CHI tetap rapuh
# dengan cap baru — celah desain yang harus diukur C).
setan_pemain:
  # Kill-switch: false -> skenario_panas mengabaikan data pemain dan
  # selalu memakai setan umum (stress.setan_points) + catatan.
  enabled: true
  # Kenaikan % 3P setan per pemain (POIN PERSENTASE: 12,0 = +12pp).
  boost_pp: 12.0
  # Batas atas % 3P setan per pemain (pecahan: 0,50 = 50%).
  cap_pct: 0.50
  # True = catat flag 3P Volume Risk bila kedua tim Top-10 3PAr.
  add_3par_volume_flag: true
  # Menit per laga minimum agar pemain dihitung sebagai rotasi.
  # INITIAL (bukan fit) — menunggu keberatan reviewer. Pemain di bawah
  # ambang ini tidak menyumbang percobaan ke setan (juga proksi
  # ketersediaan bila data cedera tidak tersedia). 10,0 menit/laga =
  # batas kasar pemain rotasi vs bangku dalam (rotasi NBA umumnya
  # 9-10 pemain; pemain ke-10 sekitar 12-18 menit/laga). RENCANA
  # KALIBRASI: ukur sensitivitas total setan terhadap ambang 5/8/10/
  # 12 menit di slate uji; bila vonis kerapuhan berubah-ubah di
  # sekitar ambang, ajukan ambang berbasis data ke user.
  ambang_menit_rotasi: 10.0
