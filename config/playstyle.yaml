# playstyle.yaml — SATU-SATUNYA sumber ambang & default strategi.
# Blueprint: muse-parlay-analyst §6, §7 (plus angka terkait §3, §4, §5, §9).
# Pelengkap: DECISIONS.md (keputusan user 2026-11-20 & 2026-11-21; kalau
# berbeda dengan blueprint, DECISIONS.md yang berlaku).
# Aturan: angka strategi TIDAK BOLEH ditulis di tempat lain (kode, SOP, laporan).
# Kalau tidak ada angka yang diputuskan, nilainya null + komentar TBD — JANGAN ditebak.
# Semua peluang dalam desimal 0–1, kecuali disebut "poin" (1 poin = 1% = 0,01).
# Mata uang: USD (USDC dicatat 1:1, DECISIONS.md D14).
# Pengali: desimal (2,35x berarti modal kembali x2,35 kalau menang).

meta:
  version: 9
  project: muse-parlay-analyst
  source: "Blueprint Mesin Analis Parlay (Muse), Nov 20 2026 + DECISIONS.md 2026-11-20 & 2026-11-21 + fit NBA Tahap 3 (2026-11-22) + integrasi Langkah 1 (market_line_check, polymarket_ladder, jup markup) + patch langkah 1b perbaikan 2 (bpm_replacement) + perbaikan 3-4 (bantalan Asuransi target peluang, ESPN cedera), 2026-11-22 + Langkah 2 (recheck pra-submit) + adopsi nilai rolling (addendum Langkah 2), 2026-11-22 + Langkah 2 (shrinkage menit+BPM ke musim lalu), 2026-11-22 + Langkah 3 (peracik tiket: Utama maks 5,0x profil user 2026-11-22), 2026-11-22"
  last_reviewed: "2026-11-22"

# ── §6a. Dua tiket ──────────────────────────────────────────────────────────
tickets:
  insurance:
    name: "Asuransi"
    multiplier_min: 2.20        # §6a default 2,20x
    multiplier_max: 2.50        # §6a default 2,50x
    min_leg_prob: 0.74          # §6a idealnya ≥74% per kaki
    # Syarat wajib §6a: pengali x modal Asuransi >= total modal kedua tiket.
    must_cover_total_stake: true
  main:
    name: "Utama"
    # Profil user 2026-11-22 (Tahap 3 Langkah 3): Utama x3–x4.
    # Menggantikan default blueprint 3,5x (batas bawah).
    multiplier_min: 3.0
    # Profil user 2026-11-22 (Tahap 3 Langkah 3): Utama x3–x4, MAKS x5
    # bila data sangat optimis; x3,5 saja sudah berkah; x9–x10 hanya
    # hiburan. Menggantikan default blueprint 6,0x.
    multiplier_max: 5.0
    # Target lunak peracik (profil user 2026-11-22): racikan Utama
    # diusahakan ≤ 4,0x; di atas itu hanya bila tidak ada kombinasi
    # yang masuk target (tetap ≤ multiplier_max 5,0x).
    target_multiplier_max: 4.0
    min_leg_prob: 0.65          # §6a idealnya ≥65% per kaki
  # Mode default. "aggressive" hanya atas perintah user per malam ("malam ini
  # mode agresif"). Di mode agresif: multiplier_max Utama bebas + moneyline
  # di bawah 65% boleh dengan label wajib (lihat filters.moneyline).
  mode: standard                # standard | aggressive
  # D13: pembagian modal default 50/50, bisa diubah lewat chat.
  stake_split_default: {insurance: 0.5, main: 0.5}

# ── §6c. Cara memilih racikan terbaik ───────────────────────────────────────
optimizer:
  # Urutan: (1) P(rugi total) terkecil, (2) EV gabungan terbesar.
  sort_by: ["p_total_loss_asc", "combined_ev_desc"]
  top_options: 3                # §6c: 3 racikan teratas
  top_option_labels: ["Paling aman", "Seimbang", "Agresif"]
  # Buang pasangan yang Asuransinya tidak bisa menutup modal (syarat §6a).
  drop_if_insurance_cannot_cover: true
  # MAHAL (keputusan user 2026-11-21): kaki MAHAL tidak masuk Tiket
  # Asuransi kecuali user memintanya eksplisit; boleh masuk Tiket
  # Utama, wajib berlabel MAHAL di racikan.
  exclude_mahal_from_insurance: true
  allow_mahal_in_main: true
  mahal_label_required_in_main: true

# ── §6d. Harga kombo ────────────────────────────────────────────────────────
combo:
  spread_cut_pct: 5.5           # §6d default potongan spread kombo 5,5%
  # Kalau user kirim pengali asli jup.ag, pengali itu yang dipakai dan
  # selisihnya disimpan untuk kalibrasi spread (D8, Tahap 4).

# ── §5c. Pembanding pasar (devig & blend) ───────────────────────────────────
blend:
  w_model: 0.3                  # §5c nilai awal w = 0,3 (pasar patokan utama)
  # p_akhir = w * p_model + (1 - w) * p_pasar. w baru naik kalau ledger
  # membuktikan model lebih akurat (kalibrasi §9, atas persetujuan user).
  # Edge per kaki = p_akhir - harga jup.ag (desimal).
  # Laporan menampilkan p_model | p_pasar (+ sumber pembanding) |
  # p_akhir terpisah (keputusan user 2026-11-21).

# ── Aturan pembanding independen (DECISIONS.md, 2026-11-20) ────────────────
comparison:
  # P1: catat provider asal setiap pasar jup.ag (Polymarket/Kalshi/lainnya).
  record_origin_provider: true
  # P2: p_market TIDAK BOLEH dari provider yang sama dengan asal pasar jup.ag.
  forbid_same_provider: true
  # P3: pembanding sah — provider prediction market yang lain + sportsbook.
  allowed_comparison_sources: ["other_prediction_provider", "sportsbook_devig"]
  # Urutan pembanding p_market (keputusan user 2026-11-20, pasca probe 2a):
  # sportsbook (Odds API, devig) -> ESPN odds (devig) -> Kalshi.
  # ESPN odds menunggu konfirmasi probe tambahan 1.
  order: ["odds_api_devig", "espn_odds_devig", "kalshi"]

# ── Label harga (keputusan user 2026-11-21, berlaku Tahap 3) ──────────────
price_labels:
  # Dari EV terhadap harga ¢ jup.ag. DISKON: EV >= +2%. MAHAL: EV < -2%.
  # Di antaranya (-2% <= EV < +2%): WAJAR.
  diskon_min_ev_pct: 2.0
  mahal_max_ev_pct: -2.0
  # MAHAL bukan lagi filter keras (mengganti filter EV < -2% di §7a):
  # kaki MAHAL tetap tampil di laporan; lihat optimizer untuk aturan tiket.

# ── D2. MODEL_ONLY (p_market tidak ada di mana pun) ─────────────────────────
model_only:
  # p_akhir = p_model. Ambang +5 poin lebih ketat (tafsiran D-T1: ambang
  # peluang minimum naik 5 poin). Maks 1 kaki per tiket, dilarang Asuransi.
  p_final_equals_p_model: true
  threshold_penalty_points: 5
  max_legs_per_ticket: 1
  banned_from_insurance: true

# ── B4. TANPA_XG (bola tanpa data xG) ───────────────────────────────────────
no_xg:
  label: "TANPA_XG"
  fallback_model: "Dixon-Coles berbasis gol"
  threshold_penalty_points: 5   # tafsiran D-T1, sama seperti MODEL_ONLY
  banned_from_insurance: true

# ── §5d. Deteksi anomali ────────────────────────────────────────────────────
anomaly:
  jup_vs_market_points: 4.0     # §5d: |jup.ag - pasar lain| > 4 poin
  model_vs_market_points: 8.0   # §5d: |model - pasar| > 8 poin
  # > 8 poin juga memicu bagian wajib "Kenapa beda?" di laporan
  # (keputusan user 2026-11-21; lihat DECISIONS.md).
  sharp_move_cents: 3           # D9: harga berubah >= 3¢ sejak pengambilan pertama

# ── Cek garis market vs model (prinsip psikologi market, 2026-11-22) ───────
market_line_check:
  # NILAI AWAL — BELUM DIKALIBRASI. Menunggu validasi atas data PAPER +
  # persetujuan user. Jangan dipakai untuk keputusan tiket nyata sebelum
  # divalidasi (lihat LAPORAN-TAHAP-3-LANGKAH-1.md).
  # Selisih |median proyeksi - garis market| di atas ini -> ANOMALI
  # "total_line_vs_model" (kira-kira sepertiga sigma total 18,22 poin).
  total_gap_points: 5.0
  # Peluang Under model minimum agar Under dianggap "aman" oleh model
  # dalam cek keselarasan dengan market.
  min_model_under_prob: 0.70

# ── Tangga Polymarket (harga venue jup.ag, Tahap 3 Langkah 1) ──────────────
polymarket_ladder:
  # HEURISTIK AWAL — garis dengan volume kumulatif di bawah ini ditandai
  # "thin" (tipis). Memisahkan garis Alt Under jauh ($5–11) dari garis
  # utama ($403–$41.964) pada contoh DET@ATL 2026-11-22. Volume Gamma
  # adalah kumulatif, jadi ini ukuran kasar, bukan likuiditas saat ini.
  min_volume_usd: 100.0

# ── §7a. Filter keras (kaki langsung dicoret, alasan dicatat) ───────────────
filters:
  all_markets:
    exclude_data_incomplete: true   # §7a: status DATA_INCOMPLETE
    # EV < -2% BUKAN lagi filter keras (keputusan user 2026-11-21):
    # kaki MAHAL tetap tampil dengan label; lihat price_labels.
  moneyline:
    min_p_final: 0.65               # §7a: p_akhir < 65% dicoret
    # Kecuali mode Agresif, dan kaki wajib diberi label (agresif).
    allow_below_min_in_aggressive: true
    aggressive_label_required: true
  nba_alt_under:
    # Salah satu tim peringkat DRtg #23-30 -> coret.
    drtg_bad_rank_from: 23
    drtg_bad_rank_to: 30
    # Kedua tim masuk 10 besar Pace -> coret.
    both_top_pace_n: 10
    # D10: bantalan = garis Alt Under - median proyeksi total.
    # Coret bila bantalan < 8 poin (< 12 poin kalau spread <= 2,5).
    min_cushion_points: 8
    min_cushion_points_close_spread: 12
    close_spread_threshold: 2.5
    # Bantalan Asuransi dari target peluang (keputusan user 2026-11-22,
    # patch langkah 1b perbaikan 3): garis terkecil dari tangga yang
    # P_model(Under) >= insurance_target_probability DAN
    # >= garis market + market_cushion_floor_points. Bila re-fit
    # mengubah sebaran, bantalan ikut menyesuaikan otomatis.
    insurance_target_probability: 0.74
    market_cushion_floor_points: 8
  football_btts_yes:
    min_combined_xg: 2.45           # §7a: total xG gabungan < 2,45 -> coret
  football_lineup:
    # Lineup belum keluar + laga < 60 menit lagi + pemain kunci diragukan.
    lineup_missing_minutes_before_kickoff: 60
    # D11: definisi pemain kunci bola.
    key_player_definition:
      goalkeeper: "kiper utama"
      centre_backs: "2 bek tengah dengan menit terbanyak"
      top_attacker: "pemain xG+xA terbanyak"
      minutes_threshold_pct: 70

# ── D7/D8. Rumus (referensi; implementasi di kode Tahap 3/4) ────────────────
formulas:
  leg_ev: "p_akhir * (100 / harga_cents) - 1"
  combo_multiplier: "prod(100 / harga_cents_i) * (1 - spread_pct / 100)"
  ticket_ev: "P(tiket menang, simulasi gabungan) * pengali - 1"

# ── D14. Mata uang ──────────────────────────────────────────────────────────
currency:
  base: "USD"
  usdc_to_usd: 1.0              # D14: USDC dicatat sebagai USD 1:1

# ── §5. Mesin hitung ────────────────────────────────────────────────────────
simulation:
  iterations: 100000            # §5: 100.000x simulasi per laga
  # D12: parameter TIDAK BOLEH ditebak — fit dari data historis, laporkan
  # hasil fit + backtest, berlaku setelah user setujui.
  fitting:
    history_seasons: "2-3"
    nba_fit_targets: ["margin", "total"]
    football_rho_method: "MLE per liga"
    requires_user_approval: true
    # Ambang minimum data untuk fit NBA (scripts/fit_nba_params.py):
    # di bawah ini parameter ditulis null + alasan, bukan ditebak.
    min_games_total: 100
    min_group_n: 30
  nba:
    distribution: student-t     # §5a: ekor tebal
    # --- HASIL FIT ROLLING point-in-time (diadopsi user 2026-11-22) ---
    # Menggantikan nilai D12 (fit rating musim penuh: sigma_total
    # 18,2198; sigma_margin 13,8168; home 1,6552; B2B -1,596; t_nu
    # 34,5). Nilai rolling dari re-fit yang sama atas rating rolling
    # (hanya laga sebelum tanggal uji — tanpa look-ahead);
    # LAPORAN-FIT-NBA.md §12; bukti out/fit_nba_params_rolling.json.
    # Pergeseran tidak material (sigma +4,2–4,4%). Altitude TIDAK
    # diadopsi (nilai rolling -0,4094 dalam noise, SE 1,14).
    # Sumber: 2701 laga (2024-25 penuh 1230 + 2025-26 penuh 1230 +
    # 2026-27 parsial 241 s.d. 21 Nov 2026); game log stats.nba.com
    # leaguegamefinder + rating Basketball-Reference.
    # Script: scripts/fit_nba_params.py --rolling. Nilai di bawah ini
    # HASIL FIT, bukan tebakan.
    sigma_points: 18.9868       # = sigma total (ringkasan satu angka)
    # Sigma margin & total HASIL FIT. Mesin memakai kedua kunci ini.
    sigma_margin_points: 14.4307  # std residual margin, n=2701
    sigma_total_points: 18.9868   # std residual total, n=2701
    # Derajat bebas Student-t, HASIL FIT (grid MLE 3-50).
    # Profil log-likelihood DATAR di 20-100 (puncak ~35,0): residual
    # nyaris normal (kurtosis lebih 0,16) — ekor tebal tidak terukur
    # kuat di level laga. Nilai 35,0 praktis setara normal.
    t_nu: 35.0
    # Intersep regresi OLS margin ~ selisih net rating (n=2701;
    # re-fit rolling).
    home_advantage_points: 1.6639
    # BERTANDA: selisih rata-rata residual poin tim B2B vs tidak
    # (re-fit rolling) — sim MENAMBAHKAN nilai ini ke poin tim B2B.
    back_to_back_penalty_points: -1.5164
    # Selisih rata-rata residual margin kandang DEN/UTA vs lainnya
    # (n_alt=180, SE 1,10): praktis NOL — tidak ada efek ketinggian
    # tambahan yang terukur di luar home advantage umum.
    altitude_adjustment_points: -0.0105
    # Penyesuaian turnamen (NBA Cup/Playoff): BELUM ADA DATA — 0 sampai
    # difit. Nilai 0 berarti flag turnamen saat ini tidak mengubah proyeksi.
    tournament_adjustment_points: 0.0
    # Skala dampak pemain absen (dampak = BPM x menit/48 x bpm_scale).
    # ASUMSI AWAL 1.0 — BELUM DIFIT (tidak ada literatur internal);
    # berlaku sebagai asumsi yang didokumentasikan, bukan hasil fit.
    bpm_scale: 1.0
    # Level pengganti (replacement level) BPM: pemain absen diganti
    # pemain level pengganti, BUKAN pemain nol — dampak absen =
    # (BPM - bpm_replacement) x menit/48 x bpm_scale x faktor overlap.
    # NILAI -2,0 DARI LITERATUR, bukan hasil fit: Basketball-Reference
    # mendefinisikan -2,0 sebagai "replacement level"
    # (http://basketball-reference.com/about/bpm.html: "-2.0 is a bench
    # player (this is also defined as 'replacement level')"; rumus
    # VORP = [BPM - (-2.0)] x %menit, https://www.sports-reference.com
    # /blog/2014/10/introducing-box-plusminus-bpm-2/).
    # Berlaku sebagai asumsi yang didokumentasikan, bukan hasil fit
    # (seperti bpm_scale); kalibrasi ulang atas data PAPER bila perlu.
    bpm_replacement: -2.0
    # Shrinkage menit + BPM ke musim lalu (patch 1c/Langkah 2, temuan
    # auditor 2): pemain dengan sedikit laga musim ini dicampur
    # dengan musim lalu — bobot musim ini w = n/(n+K), nilai akhir =
    # w*nilai_kini + (1-w)*nilai_lalu, untuk menit DAN BPM.
    # K = 10 laga: PILIHAN DESAIN mengikuti K=10 shrinkage rating
    # rolling (D-R2), BUKAN hasil fit; menunggu keberatan reviewer.
    # Rookie/tanpa data musim lalu: pakai nilai musim berjalan.
    shrinkage_k_games: 10
    # Bobot resensi statistik tim (musim vs 10 laga terakhir).
    # ASUMSI AWAL mengikuti pola §5b bola (60/40) — BELUM DIFIT.
    recency:
      season: 0.6
      last10: 0.4
    tournament_flags: ["NBA Cup", "Playoff"]  # §5a: bendera konteks
    squad_scenarios: ["full", "missing_1", "missing_2", "missing_4"]  # §5a
    overtime_minutes: 5         # §5a: OT 5 menit kalau seri setelah 48 menit
    # Batas periode OT per iterasi (pencegah loop tak hingga; peluang
    # mencapai batas ini praktis nol). Asumsi implementasi, bukan fit.
    ot_max_periods: 5
  football:
    model: dixon-coles          # §5b
    xg_weight_season: 0.60      # §5b: 60% musim
    xg_weight_recent: 0.40      # §5b: 40% 5-6 laga terakhir
    recent_matches: 6           # §5b: 5-6 laga terakhir (pakai 6, batas atas)
    dixon_coles_rho: null       # TBD — MLE per liga, Tahap 3 (D12)
    home_advantage_by_league: null  # TBD — fit Tahap 3 (D12)
    absence_penalty: null       # TBD — bek tengah/kiper/striker absen (D12)

# ── Biaya venue ─────────────────────────────────────────────────────────
fees:
  # Koefisien fee taker Kalshi (Fee Schedule resmi Kalshi, berlaku
  # 7 Juli 2026): taker fee = roundup(0,07 x C x P x (1-P)),
  # C = jumlah kontrak, P = harga. Dipakai Tahap 3 untuk mengoreksi
  # harga efektif sebelum label DISKON/WAJAR/MAHAL (MEMORY 2026-11-21).
  kalshi_taker_fee_coeff: 0.07
  # Markup tipikal jup.ag di atas harga Polymarket (median 0,5¢ dari
  # 11/11 pasar yang cocok, probe tambahan 3, 2026-11-20; mean 0,68¢,
  # maks 1,5¢). Perkiraan tipikal untuk harga venue, BUKAN angka pasti
  # per pasar — harga jup.ag asli tetap harus dibaca dari UI/API bila
  # tersedia.
  jup_typical_markup_cents: 0.5

# ── Aturan data (DECISIONS.md B, menggantikan §4) ───────────────────────────
data:
  stale_hours_injury_lineup: 3  # §4: cedera/lineup > 3 jam = "basi", ambil ulang
  recheck_window_minutes: [30, 60]  # §3: cek ulang 30-60 menit sebelum laga
  cross_check_min_sources_injury_lineup: 2  # B2: cedera & lineup min 2 sumber

# ── Cek ulang pra-submit (Tahap 3 Langkah 2) ──────────────────────────────
recheck:
  # Garis total market bergerak > ambang ini sejak analisis awal ->
  # hitung ulang simulasi + garis Asuransi/Utama (keputusan Langkah 2).
  market_line_move_points: 2.0
  # Gerakan harga >= anomaly.sharp_move_cents (3¢) sejak fetch pertama
  # -> ANOMALI + hitung ulang (aturan Thunder; ambang di anomaly,
  # tidak diduplikasi di sini). Cedera inti berubah (pemain OUT/
  # DOUBTFUL baru atau status berubah) -> hitung ulang (tanpa ambang
  # angka: perubahan status apa pun memicu hitung ulang). Data cedera
  # basi: data.stale_hours_injury_lineup (3 jam). Jendela recheck:
  # data.recheck_window_minutes ([30, 60]).

# ── §9. Ledger & kalibrasi ──────────────────────────────────────────────────
calibration:
  report_every_legs: 50         # §9: laporan kalibrasi setiap 50 kaki
  # Laporan kalibrasi membandingkan akurasi (Brier) model vs pasar
  # (keputusan user 2026-11-21); kenaikan w hanya atas persetujuan user.
  compare_brier_model_vs_market: true
