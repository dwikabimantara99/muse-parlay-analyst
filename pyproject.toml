[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "muse-parlay-analyst"
version = "0.1.0"
description = "Mesin analis parlay (NBA + sepak bola) yang workflow-nya terkunci"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "black>=24.0",
]

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# E/F/W: gaya & kesalahan dasar. I: urutan import. UP: idiom Python modern.
# B: bugbear. C4/SIM: penyederhanaan. D100/D102/D103: docstring modul,
# method publik, dan fungsi publik (aturan E2: docstring di setiap fungsi
# publik). E501 dimatikan: panjang baris diurus black.
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "D100", "D102", "D103"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Metode tes tidak wajib ber-docstring.
"tests/*.py" = ["D102", "D103"]
